    lowBox.checked = fb.low;
    lowBox.addEventListener('change', () => { fb.low = lowBox.checked; fb.page = 0; drawTable(); });
    function drawTable() {
      store.set('feedback', fb);
      const q = fb.q.trim().toLowerCase();
      let rows = forms;
      if (fb.low) rows = rows.filter(f => f.T.sat[f.i] <= 2);
      if (q) rows = rows.filter(f => ST.name[f.i].toLowerCase().includes(q) || f.T.groups[f.T.g[f.i]].label.toLowerCase().includes(q));
      const shown = rows.slice(fb.page * PAGE, (fb.page + 1) * PAGE);
      const chat = ['low', 'medium', 'high'];
      tableBox.replaceChildren(rows.length ? h('div', {class: 'tbl-wrap'}, table([
        {label: 'Student', nowrap: true}, {label: 'Week', num: true}, {label: 'Group', nowrap: true}, {label: 'Rated', num: true, used: true}, {label: 'Felt', num: true, title: 'Hidden satisfaction (the app never sees this)'},
        {label: 'Keep?', used: true}, {label: 'Came', num: true}, {label: 'Fit', num: true, title: 'Check-in weeks'}, {label: 'Productive', num: true}, {label: 'Chat'},
        {label: 'Rated reliable', num: true, used: true, title: 'Average rating received from groupmates (check-in weeks)'}, {label: 'Rated helpful', num: true, used: true}, {label: 'What would help', used: true}, {label: 'Avoid', used: true}],
        shown.map(f => {
          const T = f.T, i = f.i, grp = T.groups[T.g[i]];
          return {onclick: () => openDrawer({kind: 'student', i}), cells: [
            studentLink(i), String(f.w + 1),
            h('button', {class: 'linkbtn', type: 'button', text: grp.label, onclick: () => openDrawer({kind: 'group', strat: fb.strat, w: f.w, g: T.g[i]})}),
            ratingPill(T.sat[i]), satPill(T.u[i]), T.wma[i] ? 'Yes' : h('strong', {text: 'No'}), `${T.att[i]}/${T.mpw[i]}`,
            T.fit[i] != null ? `${T.fit[i]}/5` : '–', T.prod[i] != null ? `${T.prod[i]}/5` : '–', chat[T.chat[i]] || '–', FMT.one(T.prel[i]), FMT.one(T.phelp[i]),
            T.tags[i] ? T.tags[i].map(t => h('span', {class: 'tagchip', text: tagLabel(t)})) : '–',
            T.avoid[i] ? T.avoid[i].map((o, k) => [k ? ', ' : '', studentLink(o)]) : '–']};
        }))) : h('p', {class: 'empty', text: 'No forms match.'}),
      pager(rows.length, fb.page, p => { fb.page = p; drawTable(); }));
    }
    drawTable();
    const formsFig = figure({title: 'Every form', sub: 'Columns with a blue dot feed the learner. "Felt" is the hidden truth, shown for comparison only. Fit, productivity, chat and peer ratings are asked at check-ins only.',
      body: h('div', {class: 'stack'}, h('div', {class: 'controls'},
        h('div', {class: 'ctl'}, h('span', {class: 'field-l', text: 'Search'}), search),
        h('label', {class: 'switch', for: 'forms-low'}, lowBox, 'Only ratings of 2 or lower')), tableBox)});

    body.replaceChildren(tiles, h('div', {class: 'grid-2'}, distFig, tagFig), qFig, formsFig);
  }
  draw();
}

/* ---------- When to regroup ---------- */
function renderRegroup(root) {
  const F = D.frequency;
  root.append(h('div', {class: 'section-head'}, h('div', {},
    h('h2', {text: 'How often should matching change?'}),
    h('p', {text: 'Changing groups can fix a bad fit, but every move costs the weeks a group needs to settle, and feedback is noisy: no group is perfect. ' +
      'So two things were tested instead of guessed: how often to move unhappy students, and when to stop tuning the matching weights.'}))));
  if (!F) {
    root.append(h('div', {class: 'card'}, h('p', {}, 'Not tested yet. Run ', h('code', {text: 'python -m simulation.frequency'}), ', then rebuild the dashboard.')));
    return;
  }
  const R = F.results, pick = R.find(r => r.recommended);
  const best = R.reduce((a, b) => (b.semester_satisfaction > a.semester_satisfaction ? b : a));
  const find = (cad, str, gate) => R.find(r => r.cadence === cad && r.strikes === str && r.gate === gate);
  const pairs = R.filter(r => r.strikes === 1 && r.cadence != null).map(r => [r, find(r.cadence, 2, r.gate)]).filter(p => p[1]);
  const patience = avg(pairs.map(([a, b]) => a.semester_satisfaction - b.semester_satisfaction));
  const tuning = R.filter(r => r.gate).map(r => [r, find(r.cadence, r.strikes, false)]).filter(p => p[1]);
  const tuneGap = Math.max(...tuning.map(([a, b]) => Math.abs(a.semester_satisfaction - b.semester_satisfaction)));
  const weekly = find(1, pick.strikes, pick.gate);
  const stops = R.filter(r => r.gate && r.tuning_stopped).map(r => r.tuning_stopped);
  const ref = F.reference;

  root.append(h('div', {class: 'card stack'},
    h('div', {class: 'strat-top'}, h('h3', {text: `Recommended: ${policyLabel(pick.cadence, pick.strikes)}, and change the weights only when it helps`}), h('span', {class: 'badge strong', text: 'Final call'})),
    h('ul', {class: 'list'},
      h('li', {}, h('strong', {text: 'Act on the first unhappy answer. '}), `Waiting for a second one in a row costs ${patience.toFixed(2)} points of satisfaction on average, at every cadence: unhappy students sit in bad groups for an extra week or two.`),
      weekly && weekly !== pick ? h('li', {}, h('strong', {text: `Every ${pick.cadence} weeks is enough. `}), `Moving every week scores ${(weekly.semester_satisfaction - pick.semester_satisfaction >= 0 ? '+' : '')}${(weekly.semester_satisfaction - pick.semester_satisfaction).toFixed(3)} with ${Math.round((weekly.moves_per_student / pick.moves_per_student - 1) * 100)}% more moves: within the ${F.tie} tie margin, so the calmer option wins.`) : null,
      h('li', {}, h('strong', {text: 'Stop tuning when refits stop helping. '}), `Checked tuning scores the same as tuning every week (the biggest difference is ${tuneGap.toFixed(3)} points), so the extra changes were noise.` +
        (stops.length ? ` Tuning stopped around week ${Math.round(avg(stops))} on average.` : '')),
      h('li', {}, h('strong', {text: 'Regrouping is worth it. '}), `Never moving anyone scores ${FMT.sat(find(null, 1, true)?.semester_satisfaction)}, never regrouping at all ${FMT.sat(ref.stay?.semester_satisfaction)}, against ${FMT.sat(pick.semester_satisfaction)} for the recommendation.`)),
    h('p', {class: 'small muted', text: `Score: average true satisfaction over all ${F.weeks} weeks and all students (no group counts as 2.0), ${F.seeds} seeds, learn strategy, rule-based world. Settings within ${F.tie} of the best count as tied; the tie goes to the fewest moves.`})));

  const cadences = [[1, 'Every week'], [2, 'Every 2 weeks'], [4, 'Every 4 weeks'], [null, 'Never']];
  const cols = [[1, true, '1 answer · checked'], [1, false, '1 answer · weekly'], [2, true, '2 in a row · checked'], [2, false, '2 in a row · weekly']];
  const sats = R.map(r => r.semester_satisfaction), lo = Math.min(...sats), hi = Math.max(...sats);
  const cell = r => {
    if (!r) return h('td', {class: 'muted', text: '—', title: 'Not tested: nobody is moved for being unhappy'});
    const a = 0.08 + (r.semester_satisfaction - lo) / ((hi - lo) || 1) * 0.72;
    return h('td', {class: r.recommended ? 'pick' : null, style: `background:rgba(var(--heat),${a.toFixed(2)});color:${a > 0.55 ? 'var(--on-heat)' : 'var(--ink)'}`,
      title: `${cap(policyLabel(r.cadence, r.strikes))}, ${r.gate ? 'checked' : 'weekly'} tuning: average satisfaction ${r.semester_satisfaction.toFixed(3)}, ${FMT.pct(r.final_unhappy)} unhappy in the last week, ${r.moves_per_student.toFixed(2)} moves per student`},
      h('strong', {text: r.semester_satisfaction.toFixed(3)}), h('span', {text: `${r.moves_per_student.toFixed(2)} moves`}), r.recommended ? h('span', {text: ' · pick'}) : null);
  };
  root.append(figure({title: 'Every combination', sub: 'Average satisfaction over the semester (bigger is better) and moves per student (fewer is calmer). Darker is better. The outlined cell is the recommendation.',
    body: h('div', {class: 'tbl-wrap'}, h('table', {class: 'freq'},
      h('thead', {}, h('tr', {}, h('th', {text: 'Move unhappy students'}), cols.map(([, , t]) => h('th', {scope: 'col', text: t})))),
      h('tbody', {}, cadences.map(([cad, label]) => h('tr', {}, h('th', {class: 'rowh', scope: 'row', text: label}),
        cols.map(([str, gate]) => cell(find(cad, str, gate)))))))),
    table: () => table([{label: 'Setting'}, {label: 'Tuning'}, {label: 'Avg satisfaction', num: true}, {label: 'Unhappy, last week', num: true}, {label: 'Moves per student', num: true}, {label: 'Quits', num: true}],
      R.map(r => ({cells: [cap(policyLabel(r.cadence, r.strikes)), r.gate ? 'Checked' : 'Every week', r.semester_satisfaction.toFixed(3), FMT.pct(r.final_unhappy), r.moves_per_student.toFixed(2), FMT.count(r.quits)]})))}));

  root.append(h('div', {class: 'grid-2'},
    figure({title: 'Satisfaction against disruption', sub: 'Each bar is a setting with checked tuning, sorted by average satisfaction. The number is moves per student.',
      body: barList(R.filter(r => r.gate).sort((a, b) => b.semester_satisfaction - a.semester_satisfaction).map(r => ({
        label: cap(r.cadence == null ? 'never move unhappy students' : policyLabel(r.cadence, r.strikes).replace('move unhappy students ', '')), value: r.semester_satisfaction - 3, text: `${r.semester_satisfaction.toFixed(3)} · ${r.moves_per_student.toFixed(2)}`,
        color: r.recommended ? 'var(--s-learn)' : 'var(--viz)'})), {max: hi - 3})}),
    h('div', {class: 'card stack'}, h('h3', {text: 'The final call, as the matcher runs it'}),
      h('ul', {class: 'list'},
        h('li', {}, h('strong', {text: 'Every week: '}), 'collect the forms and update what\'s known about each student (peer ratings, complaint tags, pairs to avoid). That\'s evidence about people, not a change of method.'),
        h('li', {}, h('strong', {text: 'Change the weights only with evidence: '}), 'a refit is adopted only if it predicts the newest forms, which it hasn\'t seen, better by more than chance.'),
        h('li', {}, h('strong', {text: 'Stop when it settles: '}), 'after 3 weeks in a row without a real gain, the weights are frozen. That\'s the "good enough" point: no group is perfect, and further changes just chase noise.'),
        h('li', {}, h('strong', {text: 'Reopen on an alarm: '}), 'if average reported satisfaction drops 0.3 below where it was when tuning stopped, tuning restarts.'),
        h('li', {}, h('strong', {text: 'Move people sparingly: '}), `${policyLabel((D.meta.policy || pick).cadence, (D.meta.policy || pick).strikes)}; not before ${(D.meta.policy || {}).min_tenure || 2} weeks in a group, and not after week ${(D.meta.policy || {}).last_move_week || 11}.`)),
      h('button', {class: 'btn ghost', type: 'button', text: 'See this run\'s tuning decisions', onclick: () => goTab('learning')}))));
  root.append(note('These results come from the rule-based world, where one "I\'d switch" answer is a fairly reliable signal. If real students\' answers turn out noisier, waiting for a second answer could win. The LLM world and real feedback can check that.'));
}

/* ---------- Checks & LLM tests ---------- */
function renderChecks(root) {
  root.append(h('div', {class: 'section-head'}, h('div', {},
    h('h2', {text: 'Checks, LLM tests and assumptions'}),
    h('p', {text: 'What has to hold before the results mean anything, whether the LLM world can be trusted, and every rule the simulated world runs on.'}))));
  const C = D.checks;
  if (!C) {
    root.append(h('div', {class: 'card'}, h('p', {}, 'No checks yet. Run ', h('code', {text: 'python -m simulation.checks'}), ', then rebuild the dashboard.')));
  } else {
    const passed = C.filter(c => c.ok).length;
    const sections = [
      ['behaviour', 'Does the world behave sensibly?', 'The first 4 weeks with groups held fixed, averaged over 10 seeds; each must hold in at least 80% of them.'],
      ['realism', 'Do the first weeks look like real study groups?', 'Expected ranges are judgement calls for voluntary study groups, not measured data.'],
      ['cohort', 'Is the cohort sound?', null],
    ];
    const gen = D.meta.checks_generated ? new Date(D.meta.checks_generated) : null;
    root.append(h('div', {class: 'card'}, h('div', {class: 'who-lg'},
      passIcon(passed === C.length),
      h('div', {}, h('h3', {text: passed === C.length ? `All ${C.length} checks pass` : `${C.length - passed} of ${C.length} checks fail`}),
        gen && !isNaN(gen) ? h('p', {class: 'muted small', text: `Last run ${gen.toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})} with python -m simulation.checks`}) : null))));
    for (const [key, title, sub] of sections) {
      const items = C.filter(c => c.section === key);
      if (!items.length) continue;
      root.append(h('div', {class: 'card'}, h('h3', {text: title}), sub ? h('p', {class: 'muted small', text: sub}) : null,
        h('div', {}, items.map(c => h('div', {class: 'check'},
          passIcon(c.ok),
          h('div', {}, h('div', {class: 'check-l', text: cap(c.label)}), h('div', {class: 'check-d', text: c.detail})),
          h('div', {class: 'viz'}, checkViz(c)))))));
    }
  }
  renderCalibration(root);

  root.append(h('div', {class: 'sub-head'}, h('h3', {text: 'The cohort'})));
  root.append(h('div', {class: 'grid-2'}, COURSES.map(c => h('div', {class: 'card stack'},
    h('div', {}, h('h3', {text: `${c.code}: ${c.title}`}), h('p', {class: 'muted small', text: `${c.n} students · ${c.semester}`})),
    ...[['Year', c.mix.year], ['Gender', c.mix.gender], ['Major (top 5)', c.mix.major.slice(0, 5)]].map(([label, rows]) =>
      h('div', {class: 'stack', style: 'gap:8px'}, h('span', {class: 'field-l', text: label}),
        barList(rows.map(([k, n]) => ({label: k, value: n / c.n, text: FMT.pct(n / c.n)})), {max: 1})))))));

  root.append(h('div', {class: 'sub-head'}, h('h3', {text: 'The rules of the world'})));
  root.append(h('div', {class: 'grid-2'}, D.assumptions.map(sec => h('div', {class: 'card stack'},
    h('div', {}, h('h3', {text: sec.title}), h('p', {class: 'muted small'}, h('code', {text: sec.source}))),
    h('dl', {class: 'dl'}, sec.items.map(([k, v]) => [h('dt', {text: k}), h('dd', {text: v})]))))));
  root.append(note('These are stated assumptions chosen to be plausible for a large US public university, not measured Penn State data. Change them in the files named above and rerun to see how much the results depend on them.'));
}
function renderCalibration(root) {
  const K = D.calibration;
  root.append(h('div', {class: 'sub-head'}, h('h3', {text: 'Can the LLM world be trusted?'})));
  if (!K) {
    root.append(h('div', {class: 'card'}, h('p', {}, 'Not tested yet. Run ', h('code', {text: 'simulation\\.venv\\Scripts\\python -m simulation.calibrate'}), ', then rebuild the dashboard.')));
    return;
  }
  const M = K.model_vs_rule;
  root.append(h('p', {class: 'muted', text: `${K.model} judged ${K.calls} groups in week ${K.week} (${K.failed} failed, ${FMT.money(K.spent)} spent). The same answers are scored four ways: the rule world alone, the model held within 0.3 or 1.2 of it, and the model unclamped.`}));
  const tests = Object.keys(K.tests[0].passes);
  const detail = {
    'matched groups beat random ones': r => `${r.matched_mean.toFixed(2)} vs ${r.random_mean.toFixed(2)}`,
    'reliable students prefer reliable groupmates': r => `${r.solid_mean.toFixed(2)} vs ${r.mixed_mean.toFixed(2)}`,
    'overlapping schedules beat none': r => `${r.overlap_mean.toFixed(2)} vs ${r.no_overlap_mean.toFixed(2)}`,
    'plausible first week (2-25% unhappy)': r => `${FMT.pct(r.unhappy_share)} unhappy`,
  };
  root.append(figure({title: 'Does each version still behave sensibly?', sub: 'Each test must be clearly beyond chance (2 standard errors). Numbers are average satisfaction after week 1.',
    body: h('div', {class: 'tbl-wrap'}, table([{label: 'Test'}, ...K.tests.map(t => ({label: t.version === 'rule' ? 'Rule world' : cap(t.version), nowrap: true}))],
      tests.map(name => ({cells: [cap(name), ...K.tests.map(t => h('span', {class: 'vcell'}, passIcon(t.passes[name], true), h('span', {class: 'small', text: detail[name] ? detail[name](t) : ''})))]}))))}));

  const binds = M.binds_at;
  root.append(h('div', {class: 'grid-2'},
    h('div', {class: 'card stack'}, h('h3', {text: 'How far the model is from the rule world'}),
      h('dl', {class: 'kv'},
        h('dt', {text: 'Correlation with the rule world'}), h('dd', {text: M.correlation_with_rule.toFixed(2)}),
        h('dt', {text: 'Average offset (model minus rule)'}), h('dd', {text: `${M.mean_offset >= 0 ? '+' : ''}${M.mean_offset.toFixed(2)}`}),
        h('dt', {text: 'Average distance'}), h('dd', {text: M.mean_abs_gap.toFixed(2)})),
      h('span', {class: 'field-l', text: 'Students a clamp would change'}),
      barList(Object.entries(binds).map(([w, v]) => ({label: `Clamp ±${w}`, value: v, text: FMT.pct(v)})), {max: 1}),
      h('p', {class: 'small muted', text: 'A clamp that changes most students turns the LLM world back into the rule world. One that changes few lets the model\'s own judgement through.'})),
    h('div', {class: 'card stack'}, h('h3', {text: 'Is the model consistent?'}),
      h('div', {}, Object.entries(M.passes).map(([name, ok]) => h('div', {class: 'check', style: 'grid-template-columns:28px minmax(0,1fr)'},
        passIcon(ok), h('div', {class: 'check-l', text: cap(name)})))),
      h('dl', {class: 'kv'},
        h('dt', {text: 'Average change when asked again'}), h('dd', {text: M.repeat_wobble.toFixed(2)}),
        h('dt', {text: 'Average change with letters reversed'}), h('dd', {text: M.relabel_wobble.toFixed(2)})),
      h('p', {class: 'small muted', text: 'The model sees students as A–E with no names, gender or major, so reversing the letters tests whether position alone sways it.'}))));

  const compl = (rows, label) => figure({title: label, body: rows.length ? barList(rows.slice(0, 6).map(c => ({label: c.label, value: c.share, text: FMT.pct(c.share)})), {max: 1}) : h('p', {class: 'empty', text: 'No complaints.'})});
  root.append(h('div', {class: 'grid-2'}, compl(M.complaints_llm, 'What the model says bothers students (week 1)'), compl(M.complaints_rule, 'What the rule world says (week 1)')));
  const idx = Object.fromEntries(ST.id.map((s, i) => [s, i]));
  root.append(figure({title: 'In the model\'s words', sub: 'A spread of students from the week-1 test, from the model most below the rule world to most above.',
    body: h('div', {class: 'tbl-wrap'}, table([{label: 'Student', nowrap: true}, {label: 'Rule', num: true}, {label: 'Model', num: true}, {label: 'Note'}],
      M.notes.map(n => ({cells: [idx[n.sid] != null ? studentLink(idx[n.sid]) : n.sid, n.rule.toFixed(2), n.raw.toFixed(2), h('span', {class: 'quote', text: `“${n.note}”`})]}))))}));

  const fixed = (v, d = 2) => v == null ? '–' : v.toFixed(d);
  const multiweek = (L, name, how) => {
    if (!L) return;
    root.append(h('div', {class: 'sub-head'}, h('h3', {text: `After ${L.weeks} weeks: ${name}`}),
      h('span', {class: 'muted small', text: `${how} Clamp ±${L.clamp}, ${L.samples} ask${L.samples > 1 ? 's' : ''} per group averaged, ${L.students} students in ${L.groups} groups held fixed.` + (L.spent != null ? ` ${L.calls} calls, ${FMT.money(L.spent)}.` : '')})));
    if (L.reliable === false) root.append(note(`The budget ran out during this test (${L.asks_skipped} asks skipped, ${L.groups_judged_by_rules} group-weeks judged by the rules), so its numbers mix the two worlds. Rerun it with a higher --budget.`));
    const tests2 = Object.keys(L.tests[0].passes);
    const detail2 = {...detail, [`plausible week ${L.weeks} (5-35% unhappy)`]: r => `${FMT.pct(r.unhappy_share)} unhappy`};
    root.append(figure({title: `Does it behave sensibly after ${L.weeks} weeks?`,
      sub: `Feelings build up over weeks, which one week can't show. Group averages at the end of week ${L.weeks}; each test must be clearly beyond chance (2 standard errors).`,
      body: h('div', {class: 'tbl-wrap'}, table([{label: 'Test'}, {label: 'Rule world', nowrap: true}, {label: name, nowrap: true}],
        tests2.map(t => ({cells: [cap(t), ...L.tests.map(r => h('span', {class: 'vcell'}, passIcon(r.passes[t], true), h('span', {class: 'small', text: detail2[t] ? detail2[t](r) : ''})))]}))))}));
    const byWeek = L.by_week, series = [
      {label: name, color: color(LEARN), values: byWeek.map(b => b.llm)},
      {label: 'Rule world', color: 'var(--viz-2)', values: byWeek.map(b => b.rule_world)},
    ];
    root.append(h('div', {class: 'grid-2'},
      figure({title: 'The same matched groups, week by week', sub: 'Average satisfaction judged by each world. The two drift apart as feelings accumulate.',
        legend: legend(series), body: lineChart({series, xLabels: byWeek.map((_, k) => `W${k + 1}`), format: 'sat', bands: false, height: 180, tipTitle: k => `Week ${k + 1}`, aria: `${name} against the rule world by week`})}),
      h('div', {class: 'card stack'}, h('h3', {text: 'Noise, and how often the clamp binds'}),
        h('div', {}, Object.entries(L.passes).map(([t, ok]) => h('div', {class: 'check', style: 'grid-template-columns:28px minmax(0,1fr)'}, passIcon(ok), h('div', {class: 'check-l', text: cap(t)})))),
        h('dl', {class: 'kv'},
          h('dt', {text: 'Correlation with the rule formula'}), h('dd', {text: fixed(L.correlation_with_rule)}),
          h('dt', {text: 'LLM minus rules, on average'}), h('dd', {text: signed(L.mean_offset)}),
          h('dt', {text: 'Verdicts the clamp changed'}), h('dd', {text: FMT.pct(L.clamp_bound_share)}),
          h('dt', {text: `Spread between the ${L.samples} asks`}), h('dd', {text: fixed(L.ask_spread)}),
          h('dt', {text: 'Wobble of a single ask'}), h('dd', {text: fixed(L.wobble_single)}),
          h('dt', {text: `Wobble of the average of ${L.samples}`}), h('dd', {text: fixed(L.wobble_averaged)})),
        h('p', {class: 'small muted', text: 'Wobble: how much a verdict would change if the same group were asked again. Averaging independent asks shrinks it by about the square root of their number.'}))));
    root.append(h('div', {class: 'grid-2'}, compl(L.complaints_llm, `What the model says bothers students (${L.weeks} weeks)`), compl(L.complaints_rule, `What the rule world says (${L.weeks} weeks)`)));
  };
  multiweek(K.multiweek, 'LLM judge', 'The model judges each week from who came.');
  multiweek(K.multiweek_meetings, 'LLM with simulated meetings', 'The model first writes what happened at each meeting, then judges the week from those accounts.');
}
function checkViz(c) {
  if (c.section === 'behaviour' && c.value != null) {
    const sides = c.sides || ['This setup', 'Comparison'];
    const row = (label, v) => h('div', {class: 'pair-row'},
      h('div', {}, h('div', {class: 'small muted', text: label}), h('div', {class: 'bar-t'}, h('span', {class: 'bar-f', style: `width:${((v - 1) / 4 * 100).toFixed(1)}%;background:var(--viz)`}))),
      h('span', {text: v.toFixed(2)}));
    return h('div', {class: 'pair'}, row(sides[0], c.value), row(sides[1], c.versus),
      h('div', {class: 'small muted', text: `Satisfaction on a 1-5 scale; better in ${FMT.pct(c.share)} of seeds`}));
  }
  if (c.section === 'realism' && c.value != null) {
    const pct = c.percent === 1;
    const span = c.high - c.low;
    let lo = c.low - span * 0.6, hi = c.high + span * 0.6;
    lo = Math.min(lo, c.value); hi = Math.max(hi, c.value);
    if (pct) { lo = Math.max(0, lo); hi = Math.min(1, hi); } else { lo = Math.max(1, lo); hi = Math.min(5, hi); }
    const x = v => `${((v - lo) / (hi - lo) * 100).toFixed(1)}%`;
    const f = v => pct ? `${Math.round(v * 100)}%` : v.toFixed(2);
    return h('div', {},
      h('div', {class: 'range', title: `Expected ${f(c.low)}–${f(c.high)}; got ${f(c.value)}`},
        h('span', {class: 'okb', style: `left:${x(c.low)};width:calc(${x(c.high)} - ${x(c.low)})`}),
        h('span', {class: 'val', style: `left:${x(c.value)}`})),
      h('div', {class: 'range-l'}, h('span', {text: f(lo)}), h('span', {text: `expected ${f(c.low)}–${f(c.high)} · got ${f(c.value)}`}), h('span', {text: f(hi)})));
  }
  return null;
}

/* ---------- boot ---------- */
renderHeader();
renderLive();
buildTabs();
let start = location.hash.slice(1);
if (!TABS.some(t => t[0] === start)) {
  try { start = localStorage.getItem('studymatch-sim-tab'); } catch (e) { start = null; }
  if (!TABS.some(t => t[0] === start)) start = 'overview';
}
selectTab(start);
})();
