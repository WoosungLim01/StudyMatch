<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyMatch Semester Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<!--
  Template for the simulation dashboard. simulation/dashboard.py replaces the data
  placeholder below: run.py writes output/dashboard.html, and live.py serves the same
  page for a semester you step through. Open those, not this file.
-->
<style>
/* Layout: one centred column (max 1180px). The answer comes first (verdict, the three
   strategies, two headline charts); tabs hold the depth; a student or group opens in a
   drawer from the right. In live mode a control bar sits above the tabs.
   Visual language: docs/Design.md (navy, Fraunces + Nunito). */
:root {
  color-scheme: light;
  --bg: #EEF2F8;
  --surface: #FFFFFF;
  --surface-2: #F4F7FB;
  --band: #DCE6F5;
  --heading: #14213D;
  --ink: #1B2A41;
  --ink-2: #44506A;
  --muted: #5B6577;
  --line: rgba(27, 42, 65, 0.10);
  --line-strong: rgba(27, 42, 65, 0.18);
  --tint: rgba(20, 33, 61, 0.07);
  --accent: #14213D;
  --accent-hover: #0A1B33;
  --on-accent: #FFFFFF;
  --link: #1C5CAB;
  --focus: #5C7EA6;
  --grid: #E6EBF2;
  --axis: #C3CCD9;
  --s-stay: #8A919C;
  --s-survey: #1BAF7A;
  --s-learn: #2A78D6;
  --ref: #1B2A41;
  --viz: #3D5A80;
  --viz-2: #A3B1C6;
  --bad: #8A3B42;
  --bad-soft: #F6EBEC;
  --ok: #1C5CAB;
  --ok-soft: #E3EDFB;
  --ok-band: rgba(42, 120, 214, 0.26);
  --heat: 28, 92, 171;
  --on-heat: #FFFFFF;
  --av-1: #14213D;
  --av-2: #2C4770;
  --av-3: #5C7EA6;
  --shadow: 0 8px 24px rgba(27, 42, 65, 0.08);
  --scrim: rgba(10, 18, 32, 0.38);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  --radius: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B1220; --surface: #131C2E; --surface-2: #19243A; --band: #1B2A44;
    --heading: #E6ECF5; --ink: #E6ECF5; --ink-2: #C3CDE0; --muted: #97A3B8;
    --line: rgba(230, 236, 245, 0.10); --line-strong: rgba(230, 236, 245, 0.18); --tint: rgba(155, 184, 230, 0.12);
    --accent: #9BB8E6; --accent-hover: #B7CDF0; --on-accent: #0B1220; --link: #9BB8E6; --focus: #9BB8E6;
    --grid: #1F2A3F; --axis: #34405A;
    --s-stay: #7D8796; --s-survey: #199E70; --s-learn: #3987E5; --ref: #E6ECF5;
    --viz: #8FB0DD; --viz-2: #4F5E78;
    --bad: #E0959B; --bad-soft: #3A2228; --ok: #9BB8E6; --ok-soft: #1B2D4D; --ok-band: rgba(57, 135, 229, 0.38);
    --heat: 120, 165, 230; --on-heat: #0B1220;
    --av-1: #2C4770; --av-2: #3D5F8F; --av-3: #5C7EA6;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1220; --surface: #131C2E; --surface-2: #19243A; --band: #1B2A44;
  --heading: #E6ECF5; --ink: #E6ECF5; --ink-2: #C3CDE0; --muted: #97A3B8;
  --line: rgba(230, 236, 245, 0.10); --line-strong: rgba(230, 236, 245, 0.18); --tint: rgba(155, 184, 230, 0.12);
  --accent: #9BB8E6; --accent-hover: #B7CDF0; --on-accent: #0B1220; --link: #9BB8E6; --focus: #9BB8E6;
  --grid: #1F2A3F; --axis: #34405A;
  --s-stay: #7D8796; --s-survey: #199E70; --s-learn: #3987E5; --ref: #E6ECF5;
  --viz: #8FB0DD; --viz-2: #4F5E78;
  --bad: #E0959B; --bad-soft: #3A2228; --ok: #9BB8E6; --ok-soft: #1B2D4D; --ok-band: rgba(57, 135, 229, 0.38);
  --heat: 120, 165, 230; --on-heat: #0B1220;
  --av-1: #2C4770; --av-2: #3D5F8F; --av-3: #5C7EA6;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 0, 0, 0.55);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); }
body.locked { overflow: hidden; }
h1, h2, h3 { font-family: var(--font-display); color: var(--heading); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.12; font-weight: 700; }
h2 { font-size: clamp(21px, 2.4vw, 26px); line-height: 1.2; font-weight: 700; }
h3 { font-size: 17.5px; line-height: 1.3; font-weight: 600; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--tint); padding: 1px 6px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; }
.num { font-variant-numeric: tabular-nums; }

.page { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 72px; }
@media (max-width: 640px) { .page { padding-inline: 16px; padding-block: 18px 56px; } }

/* Header */
.top { display: grid; gap: 12px; padding-block: 6px 18px; }
.eyebrow { font: 800 12px/1 var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); max-width: 70ch; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--tint); color: var(--ink-2); font: 700 12.5px/1.25 var(--font-body); }

/* Live control bar */
.livebar { display: grid; gap: 14px; margin-bottom: 18px; }
.live-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.live-week { display: grid; gap: 8px; min-width: 0; }
.live-week strong { font: 800 24px/1 var(--font-body); color: var(--heading); }
.live-week strong span { font-weight: 700; font-size: 15px; color: var(--muted); }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots span { width: 18px; height: 8px; border-radius: 999px; background: var(--grid); }
.dots span.done { background: var(--accent); }
.dots span.exam { box-shadow: inset 0 0 0 2px var(--bad); }
.live-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.live-status { font-size: 13.5px; color: var(--ink-2); min-height: 20px; }
.live-status.err { color: var(--bad); font-weight: 700; }
.bar { height: 6px; border-radius: 999px; background: var(--grid); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
.settings { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.settings-grid { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
.world-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.world-opts { display: flex; flex-wrap: wrap; gap: 12px 18px; }
.confirm { display: grid; gap: 10px; background: var(--band); border-radius: 16px; padding: 14px 16px; }
.confirm p { max-width: 80ch; }
.seg button:disabled { opacity: 0.45; cursor: default; }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 4px; overflow-x: auto; padding-block: 10px; margin-bottom: 22px; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; color: var(--ink-2); padding: 8px 15px; border-radius: 999px; font-weight: 700; font-size: 14.5px; cursor: pointer; }
.tab:hover { background: var(--tint); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.panel { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.panel > *, .stack > *, .fig > *, .drawer-body > *, .dsec > * { min-width: 0; }

/* Layout */
.grid-2, .grid-3, .grid-4 { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1000px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card.flat { box-shadow: none; }
@media (max-width: 640px) { .card { padding: 16px; border-radius: 16px; } }
.section-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.section-head > div { display: grid; gap: 6px; min-width: 0; }
.section-head p { color: var(--ink-2); max-width: 72ch; }
.sub-head { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.sub-head h3 { font-size: 19px; }
.empty-state { text-align: center; padding: 48px 20px; display: grid; gap: 10px; justify-items: center; }
.empty-state p { color: var(--ink-2); max-width: 52ch; }

/* Overview */
.verdict { font: 600 clamp(21px, 2.7vw, 29px)/1.28 var(--font-display); color: var(--heading); max-width: 40ch; text-wrap: balance; }
.strat { display: grid; gap: 12px; align-content: start; }
.strat.best { border-color: var(--accent); }
.strat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.strat-name { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; color: var(--heading); }
.strat-desc { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
@media (min-width: 721px) { .strat-desc { min-height: calc(3 * 1.55em); } }
.hero { font: 800 48px/1 var(--font-body); color: var(--heading); letter-spacing: -0.01em; }
.hero-cap { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 12px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; color: var(--heading); }
.badge { display: inline-block; padding: 5px 11px; border-radius: 999px; background: var(--tint); color: var(--heading); font: 800 12px/1 var(--font-body); letter-spacing: 0.02em; }
.badge.strong { background: var(--accent); color: var(--on-accent); }
.delta { font-weight: 800; font-size: 13px; white-space: nowrap; }
.delta.good { color: var(--ok); }
.delta.bad { color: var(--bad); }
.delta.flat { color: var(--muted); }
.tile { display: grid; gap: 6px; align-content: start; }
.tile-l { font-weight: 800; color: var(--ink-2); font-size: 14px; }
.tile-v { font: 800 30px/1.1 var(--font-body); color: var(--heading); }
.tile-c { color: var(--ink-2); font-size: 13.5px; }
.note { background: var(--band); border-radius: 16px; padding: 16px 18px; color: var(--ink); display: flex; gap: 12px; align-items: flex-start; }
.note > span { flex: none; display: flex; }
.note svg { width: 22px; height: 22px; stroke: var(--heading); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-top: 1px; }
.happen { display: grid; gap: 10px; }
.happen-row { display: grid; grid-template-columns: minmax(150px, 22%) minmax(0, 1fr); gap: 4px 14px; align-items: start; font-size: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
.happen-row:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 560px) { .happen-row { grid-template-columns: minmax(0, 1fr); } }
.list { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
.list strong { color: var(--heading); }

/* Figures */
.fig { margin: 0; display: grid; gap: 12px; align-content: start; grid-template-columns: minmax(0, 1fr); }
.fig-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.fig-titles { display: grid; gap: 3px; min-width: 0; }
.fig-sub { color: var(--muted); font-size: 13.5px; max-width: 75ch; }
.fig-tools { display: flex; gap: 8px; flex: none; align-items: center; }
.plot { position: relative; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg-k { display: inline-block; flex: none; }
.lg-k.line { width: 18px; height: 0; border-top: 3px solid var(--c); border-radius: 3px; }
.lg-k.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
.lg-k.tick { width: 3px; height: 14px; border-radius: 2px; background: var(--c); }
.lg-k.rect { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.lg-k.ring { width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--c); }

/* Charts */
.chart { display: block; overflow: visible; font-family: var(--font-body); }
.chart:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 8px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chart .axlab { fill: var(--muted); font-size: 12px; font-weight: 700; }
.chart .rowlab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .band { opacity: 0.13; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .endlab { font-size: 12px; fill: var(--ink-2); }
.chart .endlab .v { font-weight: 800; fill: var(--ink); }
.chart .xhair { stroke: var(--line-strong); stroke-width: 1; }
.chart .ref { stroke: var(--ref); stroke-width: 1; opacity: 0.55; }
.chart .reflab { fill: var(--muted); font-size: 11px; }
.chart .zone { fill: var(--bad-soft); }
.chart .exam { fill: var(--tint); }
.chart .conn { stroke: var(--axis); stroke-width: 2.5; stroke-linecap: round; }
.chart .mk-tick { stroke-width: 3; stroke-linecap: round; }
.chart .rowbg { fill: transparent; }
.chart .rowbg.on { fill: var(--surface-2); }
.chart .pt { opacity: 0.5; }
.chart .pt-hl { stroke: var(--surface); stroke-width: 2; }
.chart .bar { transition: opacity 0.12s; }
.chart .hit { outline: none; }
.chart .hit:focus-visible { stroke: var(--focus); stroke-width: 2; }

/* Tooltip */
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 10px 28px rgba(10, 18, 32, 0.18); padding: 10px 12px; font-size: 13px; min-width: 170px; max-width: 320px; display: grid; gap: 5px; }
.tip-t { font-weight: 800; color: var(--heading); }
.tip-r { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.tip-k { width: 14px; height: 0; border-top: 2.5px solid var(--c); border-radius: 2px; }
.tip-k.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--c); }
.tip-k.tick { width: 3px; height: 12px; border: 0; border-radius: 2px; background: var(--c); }
.tip-k.none { border: 0; }
.tip-l { color: var(--ink-2); }
.tip-v { text-align: right; font-variant-numeric: tabular-nums; display: grid; }
.tip-v strong { color: var(--ink); }
.tip-s { color: var(--muted); font-size: 11.5px; }
.tip-f { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 5px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 14px; cursor: pointer; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--heading); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--tint); }
.btn.sm { padding: 5px 12px; font-size: 13px; border-width: 1.5px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:hover { background: var(--accent); }
.btn.ghost:disabled:hover { background: transparent; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font-weight: 800; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: currentColor; }
.controls { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.field-l { font: 800 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--tint); border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font-weight: 800; font-size: 13.5px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.seg button:hover { color: var(--heading); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--heading); box-shadow: 0 1px 4px rgba(10, 18, 32, 0.18); }
.input { font-size: 14px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); min-width: 0; width: 220px; max-width: 100%; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--tint); }
select.input { width: auto; cursor: pointer; }
input.input[type="number"] { width: 96px; }
.wp { display: inline-flex; gap: 6px; align-items: center; }
.switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; font-weight: 700; }
.switch input { appearance: none; -webkit-appearance: none; width: 36px; height: 21px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background 0.15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(15px); }

/* Tables */
.tbl-wrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font: 800 11px/1.3 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; vertical-align: bottom; }
.tbl th.used::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--s-learn); margin-left: 6px; vertical-align: middle; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .nowrap { white-space: nowrap; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .sec td { background: var(--surface-2); font-weight: 800; color: var(--heading); }
.tbl td.top, .tbl.top td { vertical-align: top; }
.pager { display: flex; align-items: center; gap: 8px; padding-top: 12px; flex-wrap: wrap; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.quote { font-style: italic; color: var(--ink-2); font-size: 13px; }

/* Pills, avatars, chips */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font: 800 12.5px/1.5 var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mid { background: var(--tint); color: var(--ink-2); }
.pill.good { background: var(--ok-soft); color: var(--ok); }
.pill.none { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill.strong { background: var(--accent); color: var(--on-accent); }
.pill-tag { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.85; }
.tagchip { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--ink-2); font-size: 12.5px; font-weight: 700; margin: 2px 4px 2px 0; }
.story { border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; display: grid; gap: 7px; font-size: 14px; }
.story-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.story-head strong { color: var(--heading); }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; color: #FFFFFF; font: 700 13px/1 var(--font-display); background: var(--av-1); }
.av.c2 { background: var(--av-2); }
.av.c3 { background: var(--av-3); }
.av.lg { width: 54px; height: 54px; font-size: 23px; }
.av-stack { display: inline-flex; }
.av-stack .av { width: 26px; height: 26px; font-size: 11.5px; box-shadow: 0 0 0 2px var(--surface); margin-right: -6px; }
.who { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.who-name { display: grid; min-width: 0; }
.sq-row { display: inline-flex; gap: 2px; }
.sq { width: 12px; height: 20px; border-radius: 3px; display: inline-block; }
.sq.bad { background: var(--bad); opacity: 0.75; }
.sq.mid { background: var(--axis); }
.sq.good { background: var(--ok); opacity: 0.7; }
.sq.none { box-shadow: inset 0 0 0 1px var(--line-strong); }
.sq.cur { outline: 2px solid var(--heading); outline-offset: 1px; }

/* HTML bars */
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 36%) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13.5px; }
.bar-l { color: var(--ink); font-weight: 700; min-width: 0; }
.bar-t { position: relative; height: 12px; background: var(--grid); border-radius: 0 4px 4px 0; }
.bar-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-m { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ref); border-radius: 2px; transform: translateX(-1px); opacity: 0.8; }
.bar-v { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--heading); text-align: right; min-width: 44px; }

/* Frequency table */
.freq { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: 13.5px; }
.freq th { font: 800 11px/1.3 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; text-align: center; }
.freq th.rowh { text-align: left; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--heading); white-space: nowrap; }
.freq td { border-radius: 10px; padding: 9px 8px; text-align: center; font-variant-numeric: tabular-nums; vertical-align: middle; }
.freq td strong { display: block; font-size: 16px; }
.freq td span { font-size: 11.5px; }
.freq td.pick { box-shadow: inset 0 0 0 3px var(--heading); }

/* Checks */
.check { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 42%); gap: 6px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
@media (max-width: 720px) { .check { grid-template-columns: 28px minmax(0, 1fr); } .check .viz { grid-column: 2; } }
.st-ic { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.st-ic svg { width: 15px; height: 15px; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.st-ic.pass { background: var(--ok-soft); }
.st-ic.pass svg { stroke: var(--ok); }
.st-ic.fail { background: var(--bad-soft); }
.st-ic.fail svg { stroke: var(--bad); }
.st-ic.sm { width: 20px; height: 20px; }
.st-ic.sm svg { width: 12px; height: 12px; }
.check-l { font-weight: 800; color: var(--heading); }
.check-d { color: var(--muted); font-size: 13px; }
.range { position: relative; height: 10px; border-radius: 999px; background: var(--grid); margin-block: 8px 4px; }
.range .okb { position: absolute; top: 0; bottom: 0; background: var(--ok-band); border-radius: 999px; }
.range .val { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--heading); box-shadow: 0 0 0 2px var(--surface); transform: translate(-50%, -50%); }
.range-l { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pair { display: grid; gap: 5px; font-size: 12.5px; }
.pair-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.pair-row .bar-t { height: 9px; }
.pair-row span:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--heading); }
.vcell { display: inline-flex; align-items: center; gap: 8px; }
.dl { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 9px 16px; margin: 0; font-size: 14px; }
.dl dt { font-weight: 800; color: var(--heading); }
.dl dd { margin: 0; color: var(--ink-2); }
@media (max-width: 560px) { .dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; } .dl dd { margin-bottom: 8px; } }
.log { display: grid; gap: 0; }
.log-row { display: grid; grid-template-columns: 64px 128px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-row:last-child { border-bottom: 0; }
@media (max-width: 560px) { .log-row { grid-template-columns: 56px minmax(0, 1fr); } .log-row > :last-child { grid-column: 1 / -1; } }

/* Drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100%); z-index: 41; background: var(--surface); box-shadow: -16px 0 40px rgba(10, 18, 32, 0.25); overflow-y: auto; overscroll-behavior: contain; padding-inline: 24px; padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 640px) { .drawer { padding-inline: 16px; } }
@media (prefers-reduced-motion: no-preference) { .drawer:not([hidden]) { animation: slidein 0.18s ease-out; } }
@keyframes slidein { from { transform: translateX(32px); } to { transform: none; } }
.drawer-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; background: var(--surface); padding-block: calc(14px + env(safe-area-inset-top, 0px)) 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.drawer-kicker { flex: 1; font: 800 11px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.drawer-body { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
.dsec { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.dsec > h3 { font-size: 17px; }
.who-lg { display: flex; gap: 14px; align-items: center; }
.who-lg h2 { font-size: 24px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.warn { color: var(--bad); font-weight: 800; }
.trait { display: grid; grid-template-columns: minmax(96px, 30%) minmax(0, 1fr); gap: 2px 14px; align-items: center; }
.trait-l { font-weight: 800; color: var(--heading); font-size: 13.5px; line-height: 1.25; }
.trait-l span { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.track { position: relative; height: 26px; margin-inline: 8px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--grid); }
.mk { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); background: var(--c); }
.mk.tick { width: 3px; height: 20px; border-radius: 2px; box-shadow: none; }
.mk.ring { width: 19px; height: 19px; background: transparent; border: 2.5px solid var(--c); box-shadow: none; }
.scale { display: grid; grid-template-columns: minmax(96px, 30%) minmax(0, 1fr); gap: 14px; font-size: 11px; color: var(--muted); }
.scale div { display: flex; justify-content: space-between; margin-inline: 8px; font-variant-numeric: tabular-nums; }
.avail { display: grid; grid-template-columns: 34px repeat(16, minmax(0, 1fr)); gap: 3px; font-size: 11px; color: var(--muted); align-items: center; }
.avail .c { height: 15px; border-radius: 3px; background: var(--grid); }
.avail .c.on { background: var(--viz); }
.heat { border-collapse: separate; border-spacing: 3px; font-size: 13px; width: 100%; }
.heat th { font: 800 10.5px/1.2 var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 2px 4px; text-align: center; }
.heat th.rowh { text-align: left; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 700; white-space: nowrap; }
.heat td { text-align: center; padding: 6px 4px; border-radius: 6px; font-weight: 800; font-variant-numeric: tabular-nums; }
.heat tr.spread td { background: transparent; color: var(--ink-2); font-weight: 700; }
.heat tr.spread td.wide { color: var(--bad); font-weight: 800; }

.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
</style>

<body>
<div class="page">
  <header class="top">
    <p class="eyebrow">StudyMatch · Simulation</p>
    <h1>Does learning from feedback make better study groups?</h1>
    <p class="lede" id="lede"></p>
    <div class="chips" id="meta-chips"></div>
  </header>
  <section class="card livebar" id="livebar" hidden aria-label="Simulation controls"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="panels"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-kicker" hidden>
  <div class="drawer-bar">
    <button class="btn ghost sm" id="drawer-back" type="button" hidden>Back</button>
    <span class="drawer-kicker" id="drawer-kicker"></span>
    <button class="btn ghost sm" id="drawer-close" type="button">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="tip" id="tip" hidden></div>
<script type="application/json" id="dashboard-data">__DASHBOARD_DATA__</script>
<script>
(() => {
'use strict';

/* ---------- data ---------- */
const D = JSON.parse(document.getElementById('dashboard-data').textContent);
const $ = (sel, root = document) => root.querySelector(sel);
const W = D.meta.weeks, MAXW = D.meta.max_weeks, SEEDS = D.meta.seeds, LIVE = D.meta.live;
const EXAM = new Set(D.meta.exam_weeks), CHECKIN = D.meta.checkin_every;
const STRATS = D.strategies, SID = STRATS.map(s => s.id);
const SBY = Object.fromEntries(STRATS.map(s => [s.id, s]));
const MET = Object.fromEntries(D.metrics.map(m => [m.id, m]));
const ST = D.students, N = ST.id.length, AX = D.axes, FL = D.feature_labels;
const COURSES = D.courses, TAGS = D.tags;
const LEARN = SBY.learn ? 'learn' : SID[SID.length - 1];
const NS = 'http://www.w3.org/2000/svg';
const PAGE = 25;
const state = {bands: true};
const color = id => `var(--s-${id})`;
const range = n => Array.from({length: n}, (_, i) => i);
const avg = xs => { const v = xs.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const sum = xs => xs.reduce((a, b) => a + (b || 0), 0);
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const weekNote = w => [EXAM.has(w + 1) ? 'exam week' : null, (w + 1) % CHECKIN === 0 ? 'check-in' : null].filter(Boolean).join(', ');
const weekTitle = w => weekNote(w) ? `Week ${w + 1} · ${weekNote(w)}` : `Week ${w + 1}`;
const weekLabels = () => range(W).map(w => `W${w + 1}`);
const policyLabel = (cad, str) => cad == null ? 'never move unhappy students (only place those who quit)'
  : `move unhappy students ${cad === 1 ? 'every week' : `every ${cad} weeks`}, after ${str === 1 ? '1 unhappy answer' : `${str} unhappy answers in a row`}`;
const movedSets = Object.fromEntries(SID.map(id => [id, (D.trace[id] || []).map(T => new Set(T.moved))]));
const store = {
  get(k, fallback) { try { const v = sessionStorage.getItem(`studymatch-sim-${k}`); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
  set(k, v) { try { sessionStorage.setItem(`studymatch-sim-${k}`, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

/* ---------- formatting ---------- */
const FMT = {
  pct: v => v == null ? '–' : `${Math.round(v * 100)}%`,
  share: v => v == null ? '–' : `${Math.round(v * 100)}%`,
  sat: v => v == null ? '–' : v.toFixed(2),
  r: v => v == null ? '–' : v.toFixed(3),
  one: v => v == null ? '–' : v.toFixed(1),
  count: v => {
    if (v == null) return '–';
    const x = Math.round(v * 10) / 10;
    return Number.isInteger(x) ? x.toLocaleString('en-US') : x.toFixed(1);
  },
  money: v => v == null ? '–' : `$${v.toFixed(v < 1 ? 3 : 2)}`,
};
function tickFormatter(format, step) {
  if (format === 'pct' || format === 'share') {
    const d = Math.max(0, -Math.floor(Math.log10(step * 100) + 1e-9));
    return v => `${(v * 100).toFixed(d)}%`;
  }
  if (format === 'count') return v => FMT.count(v);
  const d = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  return v => v.toFixed(d);
}
function niceTicks(lo, hi, count) {
  if (!(hi > lo)) hi = lo + 1;
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const out = [];
  for (let k = Math.floor(lo / step + 1e-9); k <= Math.ceil(hi / step - 1e-9); k++) out.push(+(k * step).toFixed(12));
  return out;
}
function delta(d, format, better, versus) {
  const size = format === 'pct' ? Math.round(Math.abs(d) * 100) : Math.abs(d);
  if (size < (format === 'pct' ? 1 : 0.005)) return h('span', {class: 'delta flat', text: `no change ${versus}`});
  const good = (d < 0) === (better === 'down');
  const text = format === 'pct' ? `${size} pts` : size.toFixed(2);
  return h('span', {class: `delta ${good ? 'good' : 'bad'}`, text: `${d < 0 ? '▼' : '▲'} ${text} ${versus}`});
}

/* ---------- DOM helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c) e.append(c);
  return e;
}
const ICON = {
  info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  pass: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  fail: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
function icon(name, cls, label) { const s = h('span', {class: cls, role: label ? 'img' : null, 'aria-label': label || null}); s.innerHTML = ICON[name]; return s; }
const passIcon = (ok, sm) => icon(ok ? 'pass' : 'fail', `st-ic ${ok ? 'pass' : 'fail'}${sm ? ' sm' : ''}`, ok ? 'Pass' : 'Fail');
const note = (...kids) => h('div', {class: 'note'}, icon('info'), h('p', {}, ...kids));

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(x, y, title, rows, foot) {
  tip.replaceChildren(
    h('div', {class: 'tip-t', text: title}),
    ...rows.map(r => h('div', {class: 'tip-r'},
      h('span', {class: `tip-k ${r.color ? (r.kind || '') : 'none'}`, style: r.color ? `--c:${r.color}` : null}),
      h('span', {class: 'tip-l', text: r.label}),
      h('span', {class: 'tip-v'}, h('strong', {text: r.value}), r.sub ? h('span', {class: 'tip-s', text: r.sub}) : null))),
    foot ? h('div', {class: 'tip-f', text: foot}) : null);
  tip.hidden = false;
  const b = tip.getBoundingClientRect(), pad = 14;
  let left = x + pad, top = y + pad;
  if (left + b.width > innerWidth - 8) left = x - b.width - pad;
  if (top + b.height > innerHeight - 8) top = y - b.height - pad;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${Math.max(8, top)}px`;
}
const hideTip = () => { tip.hidden = true; };
addEventListener('scroll', hideTip, {passive: true});

/* ---------- chart plumbing ---------- */
const ro = new ResizeObserver(entries => {
  const due = entries.map(e => e.target).filter(host => { const w = Math.round(host.clientWidth); return w > 0 && w !== host._w; });
  if (due.length) requestAnimationFrame(() => due.forEach(host => host._draw()));
});
function mountChart(host, draw) {
  host._draw = () => { const Wd = host.clientWidth; if (!Wd) return; host._w = Wd; draw(Wd); };
  ro.observe(host);
  host._draw();
  return host;
}
const lineHosts = new Set();
function redrawLines() {
  for (const host of lineHosts) {
    if (!host.isConnected) { lineHosts.delete(host); ro.unobserve(host); continue; }
    host._w = 0; host._draw();
  }
}
function svgRoot(Wd, H, label) {
  return sv('svg', {class: 'chart', width: Wd, height: H, viewBox: `0 0 ${Wd} ${H}`, role: 'img', 'aria-label': label});
}
function legend(items) {
  return h('div', {class: 'legend'}, items.map(it =>
    h('span', {class: 'lg'}, h('span', {class: `lg-k ${it.kind || 'line'}`, style: `--c:${it.color}`}), it.label)));
}
const stratLegend = () => legend(STRATS.map(s => ({label: s.label, color: color(s.id)})));
const lastIdx = vs => { for (let i = vs.length - 1; i >= 0; i--) if (vs[i] != null) return i; return -1; };

/* Line chart. o: {series [{label, short, color, values, band}], xLabels, format, yDomain, ticks, min, height,
   endLabels, zone [lo, hi], ref {value, label, name}, shadeExams, tipTitle(i), bands (false = never), left, aria} */
function lineChart(o) {
  const host = h('div', {class: 'plot'});
  lineHosts.add(host);
  return mountChart(host, Wd => {
    const H = o.height || 230, ends = o.endLabels && Wd >= 440;
    const m = {t: 12, r: ends ? 104 : 16, b: 30, l: o.left || 46};
    const iw = Wd - m.l - m.r, ih = H - m.t - m.b;
    const bands = o.bands !== false && state.bands && SEEDS > 1 && o.series.some(sr => sr.band);
    let lo, hi, ticks;
    if (o.yDomain) {
      [lo, hi] = o.yDomain;
      ticks = o.ticks || niceTicks(lo, hi, 4).filter(t => t >= lo - 1e-9 && t <= hi + 1e-9);
    } else {
      const vals = [];
      for (const sr of o.series) {
        sr.values.forEach(v => { if (v != null) vals.push(v); });
        if (bands && sr.band) sr.band.forEach(([a, b]) => vals.push(a, b));
      }
      if (o.ref) vals.push(o.ref.value);
      if (!vals.length) vals.push(0, 1);
      lo = Math.min(...vals); hi = Math.max(...vals);
      const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.08 || 0.05;
      lo -= pad; hi += pad;
      if (o.min != null) lo = Math.max(lo, o.min);
      ticks = niceTicks(lo, hi, ih < 130 ? 3 : 4);
      lo = ticks[0]; hi = ticks[ticks.length - 1];
    }
    const tf = tickFormatter(o.format, ticks.length > 1 ? ticks[1] - ticks[0] : 1);
    const vf = FMT[o.format];
    const n = o.xLabels.length, inset = 10;
    const X = i => m.l + inset + (n === 1 ? (iw - 2 * inset) / 2 : i * (iw - 2 * inset) / (n - 1));
    const Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
    const svg = svgRoot(Wd, H, o.aria || 'Line chart');
    svg.setAttribute('tabindex', '0');
    if (o.shadeExams && n > 1) {
      const step = (iw - 2 * inset) / (n - 1);
      range(n).forEach(i => { if (EXAM.has(i + 1)) svg.append(sv('rect', {class: 'exam', x: X(i) - step / 2, width: step, y: m.t, height: ih})); });
    }
    if (o.zone) {
      const top = Y(Math.min(hi, o.zone[1])), bottom = Y(Math.max(lo, o.zone[0]));
      svg.append(sv('rect', {class: 'zone', x: m.l, width: iw, y: top, height: Math.max(0, bottom - top), rx: 4}));
    }
    ticks.forEach((t, k) => {
      const y = Y(t);
      svg.append(sv('line', {class: k === 0 ? 'axis' : 'grid', x1: m.l, x2: m.l + iw, y1: y, y2: y}),
        sv('text', {class: 'tick', x: m.l - 8, y: y + 4, 'text-anchor': 'end', text: tf(t)}));
    });
    const every = Math.max(1, Math.ceil(n * 30 / Math.max(1, iw - 2 * inset)));
    o.xLabels.forEach((lab, i) => {
      if ((n - 1 - i) % every === 0) svg.append(sv('text', {class: 'tick', x: X(i), y: H - 9, 'text-anchor': 'middle', text: lab}));
    });
    if (o.ref) {
      const y = Y(o.ref.value);
      svg.append(sv('line', {class: 'ref', x1: m.l, x2: m.l + iw, y1: y, y2: y}));
      if (o.ref.label) svg.append(sv('text', {class: 'reflab', x: m.l + iw, y: y - 5, 'text-anchor': 'end', text: o.ref.label}));
    }
    const pathOf = vs => {
      let d = '', pen = false;
      vs.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true;
      });
      return d;
    };
    if (bands) for (const sr of o.series) if (sr.band) {
      const top = sr.band.map(([, b], i) => `${X(i).toFixed(1)},${Y(b).toFixed(1)}`);
      const bot = sr.band.map(([a], i) => `${X(i).toFixed(1)},${Y(a).toFixed(1)}`).reverse();
      svg.append(sv('polygon', {class: 'band', points: top.concat(bot).join(' '), style: `fill:${sr.color}`}));
    }
    for (const sr of o.series) svg.append(sv('path', {class: 'ln', d: pathOf(sr.values), style: `stroke:${sr.color}`}));
    for (const sr of o.series) {
      sr.values.forEach((v, i) => {
        const single = (sr.values[i - 1] == null) && (sr.values[i + 1] == null);
        if (v != null && (i === lastIdx(sr.values) || single)) svg.append(sv('circle', {class: 'dot', cx: X(i), cy: Y(v), r: 4.5, style: `fill:${sr.color}`}));
      });
    }
    if (ends) {
      const labs = o.series.map(sr => { const i = lastIdx(sr.values); return i < 0 ? null : {sr, y: Y(sr.values[i]), v: sr.values[i]}; })
        .filter(Boolean).sort((a, b) => a.y - b.y);
      if (labs.every((l, k) => k === 0 || l.y - labs[k - 1].y >= 15)) {
        for (const l of labs) svg.append(sv('text', {class: 'endlab', x: m.l + iw + 10, y: l.y + 4},
          sv('tspan', {class: 'v', text: vf(l.v)}), sv('tspan', {dx: 6, text: l.sr.short || l.sr.label})));
      }
    }
    const xh = sv('line', {class: 'xhair', y1: m.t, y2: m.t + ih, visibility: 'hidden'});
    const hl = sv('g');
    const hit = sv('rect', {x: m.l, y: m.t, width: iw, height: ih, fill: 'transparent'});
    svg.append(xh, hl, hit);
    let cur = -1;
    const show = (i, cx, cy) => {
      cur = i;
      xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility', 'visible');
      const live = o.series.filter(sr => sr.values[i] != null);
      hl.replaceChildren(...live.map(sr => sv('circle', {class: 'dot', cx: X(i), cy: Y(sr.values[i]), r: 5, style: `fill:${sr.color}`})));
      const rows = live.slice().sort((a, b) => b.values[i] - a.values[i]).map(sr => ({
        color: sr.color, label: sr.label, value: vf(sr.values[i]),
        sub: bands && sr.band ? `${vf(sr.band[i][0])}–${vf(sr.band[i][1])} across seeds` : null}));
      if (o.ref && o.ref.name) rows.push({color: 'var(--ref)', kind: 'tick', label: o.ref.name, value: vf(o.ref.value)});
      showTip(cx, cy, o.tipTitle ? o.tipTitle(i) : o.xLabels[i], rows.length ? rows : [{label: 'No value', value: '–'}], o.tipFoot);
    };
    const hide = () => { cur = -1; xh.setAttribute('visibility', 'hidden'); hl.replaceChildren(); hideTip(); };
    const nearest = px => { let best = 0; for (let i = 1; i < n; i++) if (Math.abs(X(i) - px) < Math.abs(X(best) - px)) best = i; return best; };
    const onPoint = e => { const b = svg.getBoundingClientRect(); show(nearest(e.clientX - b.left), e.clientX, e.clientY); };
    hit.addEventListener('pointermove', onPoint);
    hit.addEventListener('pointerdown', onPoint);
    hit.addEventListener('pointerleave', hide);
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') { if (e.key === 'Escape') hide(); return; }
      e.preventDefault();
      const step = e.key === 'ArrowLeft' ? -1 : 1;
      const i = cur < 0 ? (step < 0 ? n - 1 : 0) : Math.max(0, Math.min(n - 1, cur + step));
      const b = svg.getBoundingClientRect();
      show(i, b.left + X(i), b.top + m.t);
    });
    host.replaceChildren(svg);
  });
}

function barPath(x, y, w, ht) {
  if (ht <= 0.5) return '';
  const r = Math.min(4, ht, w / 2);
  return `M${x},${y + ht}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + ht}Z`;
}

/* Grouped columns. o: {categories, series [{label, color, values}], format, height, tipTitle(c), aria} */
function columnChart(o) {
  const host = h('div', {class: 'plot'});
  return mountChart(host, Wd => {
    const H = o.height || 220, m = {t: 12, r: 8, b: 30, l: 44};
    const iw = Wd - m.l - m.r, ih = H - m.t - m.b;
    const max = Math.max(0.0001, ...o.series.flatMap(s => s.values));
    const ticks = niceTicks(0, max, 4), hi = ticks[ticks.length - 1];
    const tf = tickFormatter(o.format, ticks[1] - ticks[0]);
    const Y = v => m.t + ih - v / hi * ih;
    const nc = o.categories.length, ns = o.series.length, band = iw / nc;
    const bw = Math.max(6, Math.min(24, (band * 0.7 - 2 * (ns - 1)) / ns));
    const svg = svgRoot(Wd, H, o.aria || 'Column chart');
    ticks.forEach((t, k) => svg.append(
      sv('line', {class: k === 0 ? 'axis' : 'grid', x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t)}),
      sv('text', {class: 'tick', x: m.l - 8, y: Y(t) + 4, 'text-anchor': 'end', text: tf(t)})));
    o.categories.forEach((cat, c) => {
      const cx = m.l + band * (c + 0.5), total = ns * bw + (ns - 1) * 2, x0 = cx - total / 2;
      const bars = o.series.map((sr, k) => sv('path', {class: 'bar', d: barPath(x0 + k * (bw + 2), Y(sr.values[c]), bw, Y(0) - Y(sr.values[c])), style: `fill:${sr.color}`}));
      svg.append(...bars, sv('text', {class: 'tick', x: cx, y: H - 9, 'text-anchor': 'middle', text: cat}));
      const hit = sv('rect', {class: 'hit', x: cx - band / 2, y: m.t, width: band, height: ih, fill: 'transparent', tabindex: 0});
      const show = (x, y) => {
        svg.querySelectorAll('.bar').forEach(b => { b.style.opacity = bars.includes(b) ? 1 : 0.45; });
        showTip(x, y, o.tipTitle ? o.tipTitle(c) : cat, o.series.map(sr => ({color: sr.color, kind: 'dot', label: sr.label, value: FMT[o.format](sr.values[c])})));
      };
      const hide = () => { svg.querySelectorAll('.bar').forEach(b => { b.style.opacity = 1; }); hideTip(); };
      hit.addEventListener('pointermove', e => show(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', hide);
      hit.addEventListener('focus', () => { const b = hit.getBoundingClientRect(); show(b.left + b.width / 2, b.top); });
      hit.addEventListener('blur', hide);
      svg.append(hit);
    });
    host.replaceChildren(svg);
  });
}

/* Dot plot, one row per item. o: {rows [{label, hint, marks [{key, label, value, color, kind}]}], domain, format, connect, aria} */
function dotPlot(o) {
  const host = h('div', {class: 'plot'});
  return mountChart(host, Wd => {
    const narrow = Wd < 520, rowH = 40, m = {t: 4, r: 18, b: 30, l: narrow ? 112 : 168};
    const H = m.t + m.b + o.rows.length * rowH, iw = Wd - m.l - m.r, [lo, hi] = o.domain;
    const ticks = niceTicks(lo, hi, narrow ? 3 : 5).filter(t => t >= lo - 1e-9 && t <= hi + 1e-9);
    const tf = tickFormatter(o.format, ticks.length > 1 ? ticks[1] - ticks[0] : 1);
    const X = v => m.l + (v - lo) / (hi - lo) * iw;
    const svg = svgRoot(Wd, H, o.aria || 'Dot plot');
    const bgs = o.rows.map((_, k) => sv('rect', {class: 'rowbg', x: 4, y: m.t + k * rowH + 3, width: Wd - 8, height: rowH - 6, rx: 9}));
    svg.append(...bgs);
    for (const t of ticks) svg.append(
      sv('line', {class: 'grid', x1: X(t), x2: X(t), y1: m.t, y2: H - m.b}),
      sv('text', {class: 'tick', x: X(t), y: H - 10, 'text-anchor': 'middle', text: tf(t)}));
    o.rows.forEach((row, k) => {
      const y = m.t + k * rowH + rowH / 2;
      svg.append(sv('text', {class: 'rowlab', x: m.l - 14, y: y + 4, 'text-anchor': 'end', text: row.label}));
      if (o.connect) {
        const a = row.marks.find(mk => mk.key === o.connect[0]), b = row.marks.find(mk => mk.key === o.connect[1]);
        if (a && b) svg.append(sv('line', {class: 'conn', x1: X(a.value), x2: X(b.value), y1: y, y2: y}));
      }
      for (const mk of row.marks) {
        svg.append(mk.kind === 'tick'
          ? sv('line', {class: 'mk-tick', x1: X(mk.value), x2: X(mk.value), y1: y - 10, y2: y + 10, style: `stroke:${mk.color}`})
          : sv('circle', {class: 'dot', cx: X(mk.value), cy: y, r: 6.5, style: `fill:${mk.color}`}));
      }
      const hit = sv('rect', {class: 'hit', x: 0, y: y - rowH / 2, width: Wd, height: rowH, fill: 'transparent', tabindex: 0});
      const show = (x, yy) => {
        bgs[k].classList.add('on');
        showTip(x, yy, row.label, row.marks.map(mk => ({color: mk.color, kind: mk.kind === 'tick' ? 'tick' : 'dot', label: mk.label, value: FMT[o.format](mk.value)})), row.hint);
      };
      const hide = () => { bgs[k].classList.remove('on'); hideTip(); };
      hit.addEventListener('pointermove', e => show(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', hide);
      hit.addEventListener('focus', () => { const b = hit.getBoundingClientRect(); show(b.left + m.l, b.top); });
      hit.addEventListener('blur', hide);
      svg.append(hit);
    });
    host.replaceChildren(svg);
  });
}

/* Scatter with nearest-point hover. o: {points [{x, y, i}], color, domain, xLabel, yLabel, tipRows(p), onPick(i), aria} */
function scatter(o) {
  const host = h('div', {class: 'plot'});
  return mountChart(host, Wd => {
    const H = Math.round(Math.min(360, Math.max(250, Wd * 0.78))), m = {t: 10, r: 14, b: 46, l: 50};
    const iw = Wd - m.l - m.r, ih = H - m.t - m.b, [lo, hi] = o.domain;
    const X = v => m.l + (v - lo) / (hi - lo) * iw, Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
    const svg = svgRoot(Wd, H, o.aria);
    for (let t = lo; t <= hi; t++) {
      svg.append(sv('line', {class: t === lo ? 'axis' : 'grid', x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t)}),
        sv('line', {class: t === lo ? 'axis' : 'grid', x1: X(t), x2: X(t), y1: m.t, y2: m.t + ih}),
        sv('text', {class: 'tick', x: m.l - 8, y: Y(t) + 4, 'text-anchor': 'end', text: String(t)}),
        sv('text', {class: 'tick', x: X(t), y: m.t + ih + 16, 'text-anchor': 'middle', text: String(t)}));
    }
    const angle = -Math.atan2(ih, iw) * 180 / Math.PI, lx = X(lo + 0.12 * (hi - lo)), ly = Y(lo + 0.12 * (hi - lo)) - 6;
    svg.append(sv('line', {class: 'ref', x1: X(lo), y1: Y(lo), x2: X(hi), y2: Y(hi)}),
      sv('text', {class: 'reflab', x: lx, y: ly, transform: `rotate(${angle.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})`, text: 'matches the truth'}),
      sv('text', {class: 'axlab', x: m.l + iw / 2, y: H - 6, 'text-anchor': 'middle', text: o.xLabel}),
      sv('text', {class: 'axlab', x: 14, y: m.t + ih / 2, 'text-anchor': 'middle', transform: `rotate(-90 14 ${m.t + ih / 2})`, text: o.yLabel}));
    const g = sv('g', {style: `fill:${o.color}`});
    for (const p of o.points) g.append(sv('circle', {class: 'pt', cx: X(p.x).toFixed(1), cy: Y(p.y).toFixed(1), r: 2.7}));
    const ring = sv('circle', {class: 'pt-hl', r: 6, visibility: 'hidden', style: `fill:${o.color}`});
    svg.append(g, ring);
    let near = null;
    svg.addEventListener('pointermove', e => {
      const b = svg.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top;
      let best = null, bd = 16 * 16;
      for (const p of o.points) { const dx = X(p.x) - px, dy = Y(p.y) - py, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = p; } }
      near = best;
      if (!best) { ring.setAttribute('visibility', 'hidden'); svg.style.cursor = ''; hideTip(); return; }
      ring.setAttribute('cx', X(best.x)); ring.setAttribute('cy', Y(best.y)); ring.setAttribute('visibility', 'visible');
      svg.style.cursor = 'pointer';
      showTip(e.clientX, e.clientY, ST.name[best.i], o.tipRows(best), 'Click to open this student');
    });
    svg.addEventListener('pointerleave', () => { near = null; ring.setAttribute('visibility', 'hidden'); hideTip(); });
    svg.addEventListener('click', () => { if (near) { hideTip(); o.onPick(near.i); } });
    host.replaceChildren(svg);
  });
}

/* Horizontal bars in HTML: rows [{label, value, text, mark, markTitle}] */

/* Figure card with an optional table twin. */
function figure({title, sub, legend: lg, body, table: tableFn, tools, cls}) {
  const tableBox = h('div', {class: 'tbl-wrap'});

  let btn = null;
  if (tableFn) {
    btn = h('button', {class: 'btn ghost sm', type: 'button', 'aria-pressed': 'false', text: 'Show table'});
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-pressed') !== 'true';
      btn.setAttribute('aria-pressed', String(on));
      btn.textContent = on ? 'Show chart' : 'Show table';
      body.hidden = on;

function table(cols, rows) {
  return h('table', {class: 'tbl'},
    h('thead', {}, h('tr', {}, cols.map(c => h('th', {class: [c.num ? 'num' : '', c.used ? 'used' : ''].join(' ').trim() || null, scope: 'col', title: c.title || null, text: c.label})))),
    h('tbody', {}, rows.map(r => {
      const tr = h('tr', {class: r.cls || (r.onclick ? 'click' : null)}, r.cells.map((cell, k) =>
        h('td', {class: cols[k] && (cols[k].num ? 'num' : cols[k].nowrap ? 'nowrap' : cols[k].top ? 'top' : null), colspan: r.span && k === 0 ? r.span : null}, cell)));
      if (r.onclick) tr.addEventListener('click', e => { if (!e.target.closest('button')) r.onclick(); });
      return tr;
    })));
}
function pager(total, page, onPage) {
  const pages = Math.max(1, Math.ceil(total / PAGE));
  const from = total ? page * PAGE + 1 : 0, to = Math.min(total, (page + 1) * PAGE);
  return h('div', {class: 'pager'},
    h('span', {class: 'muted small', text: `${from.toLocaleString('en-US')}–${to.toLocaleString('en-US')} of ${total.toLocaleString('en-US')}`}),
    h('span', {class: 'grow'}),
    h('button', {class: 'btn ghost sm', type: 'button', disabled: page <= 0, onclick: () => onPage(page - 1), text: 'Previous'}),
    h('button', {class: 'btn ghost sm', type: 'button', disabled: page >= pages - 1, onclick: () => onPage(page + 1), text: 'Next'}));
}
function seg(label, options, value, onChange) {
  const group = h('div', {class: 'seg', role: 'group', 'aria-label': label});
  for (const [v, text, key] of options) {
    const b = h('button', {type: 'button', 'aria-pressed': String(v === value)},
      key ? h('span', {class: 'lg-k line', style: `--c:${key}`}) : null, text);
    b.addEventListener('click', () => {
      for (const x of group.children) x.setAttribute('aria-pressed', String(x === b));
      onChange(v);
    });
    group.append(b);
  }
  return h('div', {class: 'ctl'}, h('span', {class: 'field-l', text: label}), group);
}
const stratSeg = (value, onChange) => seg('Strategy', STRATS.map(s => [s.id, s.label, color(s.id)]), value, onChange);
function weekPicker(value, onChange, withAll) {
  const lowest = withAll ? -1 : 0;
  const sel = h('select', {class: 'input', 'aria-label': 'Week'},
    withAll ? h('option', {value: -1, text: 'All weeks', selected: value === -1}) : null,
    range(W).map(w => h('option', {value: w, text: weekTitle(w), selected: value === w})));
  const go = v => { sel.value = String(v); onChange(v); };
  sel.addEventListener('change', () => onChange(+sel.value));
  return h('div', {class: 'ctl'}, h('span', {class: 'field-l', text: 'Week'}), h('div', {class: 'wp'},
    h('button', {class: 'btn ghost sm', type: 'button', 'aria-label': 'Previous week', text: '‹', onclick: () => { if (+sel.value > lowest) go(+sel.value - 1); }}),
    sel,
    h('button', {class: 'btn ghost sm', type: 'button', 'aria-label': 'Next week', text: '›', onclick: () => { if (+sel.value < W - 1) go(+sel.value + 1); }})));
}
function bandSwitch() {
  if (SEEDS < 2) return null;
  const input = h('input', {type: 'checkbox', class: 'band-toggle'});
  input.checked = state.bands;
  input.addEventListener('change', () => {
    state.bands = input.checked;
    document.querySelectorAll('.band-toggle').forEach(x => { x.checked = state.bands; });
    redrawLines();
  });
  return h('label', {class: 'switch'}, input, `Show the range across ${SEEDS} seeds`);
}

function llmCard() {
  // How the LLM's verdicts compared with the rule formula on the same weeks, for the headline strategy.
  const weeks = D.trace[LEARN].map(T => Object.entries(T.llm).filter(([, v]) => v[1] != null).map(([i, v]) =>
    ({rule: v[0], raw: v[1], final: T.u[i], asks: v[3] || [], clamped: v[4] == null ? Math.abs(T.u[i] - v[1]) > 0.005 : Boolean(v[4])})));
  if (!weeks.some(v => v.length)) return null;
  const all = weeks.flat();
  const mx = avg(all.map(p => p.raw)), my = avg(all.map(p => p.rule));
  let sxy = 0, sxx = 0, syy = 0;
  for (const p of all) { sxy += (p.raw - mx) * (p.rule - my); sxx += (p.raw - mx) ** 2; syy += (p.rule - my) ** 2; }
  const r = sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
  const offset = avg(all.map(p => p.raw - p.rule));
  const clamped = all.filter(p => p.clamped).length / all.length;
  const spreads = all.filter(p => p.asks.length > 1).map(p => Math.max(...p.asks) - Math.min(...p.asks));
  const k = D.meta.samples || (all.find(p => p.asks.length) || {asks: []}).asks.length || 1;
  const series = [
    {label: 'Judged by the LLM (after the clamp)', color: color(LEARN), values: weeks.map(v => avg(v.map(p => p.final)))},
    {label: 'The rule formula on the same weeks', color: 'var(--viz-2)', values: weeks.map(v => avg(v.map(p => p.rule)))},
  ];
  return h('div', {class: 'card stack'},
    h('div', {}, h('h3', {text: 'How the LLM judged the weeks, next to the rules'}),
      h('p', {class: 'muted small', text: `"${SBY[LEARN].label}" groups, every student the model answered for. The rule formula is what the rule-based world would have said about the same groups, meetings and moods.`})),
    h('div', {class: 'grid-4'},
      h('div', {class: 'tile'}, h('span', {class: 'tile-l', text: 'Agreement with the rules'}), h('span', {class: 'tile-v', text: r == null ? '–' : `r = ${r.toFixed(2)}`}), h('span', {class: 'tile-c', text: 'Correlation of the model\'s raw answers with the rule formula, student by student.'})),
      h('div', {class: 'tile'}, h('span', {class: 'tile-l', text: 'LLM minus rules'}), h('span', {class: 'tile-v', text: signed(offset)}), h('span', {class: 'tile-c', text: 'Average difference before the clamp. Positive: the model is kinder than the formula.'})),
      h('div', {class: 'tile'}, h('span', {class: 'tile-l', text: 'Verdicts the clamp changed'}), h('span', {class: 'tile-v', text: FMT.pct(clamped)}), h('span', {class: 'tile-c', text: 'How often the model\'s answer was pulled back toward the rule formula.'})),
      h('div', {class: 'tile'}, h('span', {class: 'tile-l', text: `Spread between the ${k} asks`}), h('span', {class: 'tile-v', text: spreads.length ? avg(spreads).toFixed(2) : '–'}), h('span', {class: 'tile-c', text: spreads.length ? 'Highest minus lowest answer for the same student, averaged. The verdict is the mean of the asks.' : 'One ask per group, so no spread to measure.'}))),
    legend(series),
    lineChart({series, xLabels: weekLabels(), format: 'sat', bands: false, shadeExams: true, height: 190, tipTitle: weekTitle, aria: 'LLM verdicts against the rule formula by week'}));
}

/* ---------- What it learned ---------- */

function renderLearning(root) {

  root.append(h('div', {class: 'section-head'}, h('div', {},
    h('h2', {text: 'What the matcher learned from feedback'}),
    h('p', {text: `Only "${SBY[LEARN].label}" updates anything. It sees survey answers, schedules and the forms, never the hidden truth.`}))));

  const keys = [

    {key: 'hidden', label: "World's hidden weights", color: 'var(--ref)', kind: 'tick'},

  root.append(figure({

    sub: `Every week it refits the weights from all the forms so far, but only adopts the refit if it predicts that week's forms (which it hasn't seen) better by more than chance. ` +
      `After 3 weeks in a row without a real gain it stops tuning, and restarts only if reported satisfaction drops sharply.` + (SEEDS > 1 ? ' Seed 0.' : ''),
    body: decisionLog(D.learner_log)}));

  const steps = ['Start', ...weekLabels()];
  const pathMax = Math.max(...W8.learned_path.flatMap(p => F.map(f => p[f])), ...F.map(f => W8.hidden[f]));
  const yTop = Math.ceil(pathMax * 20) / 20;

  const accKeys = [

    {key: 'end', label: `After ${W} week${W > 1 ? 's' : ''} of feedback`, color: color(LEARN), kind: 'dot'},
  ];
  root.append(figure({
    title: 'How well it knows each trait',
    sub: `Correlation between the matcher's picture and the hidden truth, over all ${N.toLocaleString('en-US')} students. Peer ratings (at check-ins) feed reliability and collaboration; complaint tags nudge the other four.`,
    legend: legend(accKeys),
    body: dotPlot({rows: AX.map(a => ({label: FL[a], hint: D.axis_hints[a], marks: [{...accKeys[0], value: acc[0][a]}, {...accKeys[1], value: acc[W][a]}]})),

  }));

  $('#drawer-close').focus();
}
function closeDrawer() {
  drawer.hidden = true; scrim.hidden = true; stack = [];
  document.body.classList.remove('locked');
  hideTip();
  dbody.replaceChildren();
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
function renderDrawer() {
  const v = stack[stack.length - 1];
  $('#drawer-back').hidden = stack.length < 2;
  $('#drawer-kicker').textContent = v.kind === 'student' ? 'Student' : 'Group';
  hideTip();
  dbody.replaceChildren(...(v.kind === 'student' ? studentView(v.i) : groupView(v.strat, v.w, v.g)));
}
$('#drawer-close').addEventListener('click', closeDrawer);
$('#drawer-back').addEventListener('click', () => { stack.pop(); renderDrawer(); drawer.scrollTop = 0; });
scrim.addEventListener('click', closeDrawer);
addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });
drawer.addEventListener('scroll', hideTip, {passive: true});

function studentView(i) {

    h('h2', {text: ST.name[i]}),

    h('p', {class: 'muted small', text: `${ST.id[i]} · prefers ${ST.per_week[i]} session${ST.per_week[i] > 1 ? 's' : ''} a week${ST.careless[i] ? ` · answered the survey carelessly (${ST.careless[i].replace('_', '-')})` : ''}`}))));

  const series = SID.map(id => ({label: SBY[id].label, short: SBY[id].short, color: color(id), values: range(W).map(r => D.trace[id][r].u[i])}));

    h('p', {class: 'muted small', text: 'Hidden satisfaction at the end of each week. The pink zone is unhappy (below 3). Gaps mean no group.'}),

  const learned = W ? D.trace[LEARN][W - 1].prof : null;
  const traitKeys = [

        h('span', {class: 'mk tick', style: `left:${pos(ST.truth[i][k])};--c:var(--ref)`}),
        h('span', {class: 'mk', style: `left:${pos(ST.survey[i][k])};--c:${color('survey')}`}),

    h('div', {class: 'scale'}, h('span'), h('div', {}, ['1', '2', '3', '4', '5'].map(t => h('span', {text: t}))))));

  const A = D.averages;

function weekTable(i, strat) {
  const rows = range(W).map(w => {
    const T = D.trace[strat][w], g = T.g[i];
    if (g < 0) return {cells: [`W${w + 1}`, h('span', {class: 'muted', text: 'No group'}), satPill(null), '–', h('span', {class: 'muted small', text: 'Counts as 2.0'})]};
    const grp = T.groups[g], notes = [];
    if (T.left[i] === 1) notes.push(h('div', {class: 'warn small', text: 'Quit the group'}));
    if (T.resp[i] === 1) {
      notes.push(h('div', {class: 'small', text: `Came to ${T.att[i]} of ${T.mpw[i]}${T.prel[i] != null ? ` · rated ${FMT.one(T.prel[i])} reliable, ${FMT.one(T.phelp[i])} helpful by groupmates` : ''}`}));
      if (T.tags[i]) notes.push(h('div', {}, T.tags[i].map(t => h('span', {class: 'tagchip', text: tagLabel(t)}))));
      if (T.avoid[i]) notes.push(h('div', {class: 'small'}, 'Avoid: ', T.avoid[i].map((o, k) => [k ? ', ' : '', studentLink(o)])));
    } else notes.push(h('div', {class: 'muted small', text: 'Didn\'t answer the form'}));
    const llm = T.llm[i];
    if (llm && llm[2]) notes.push(h('div', {class: 'quote', text: `“${llm[2]}”`, title: `LLM ${llm[1]} · rule world ${llm[0]}`}));
    if (w < W - 1 && movedSets[strat][w].has(i)) notes.push(h('div', {class: 'small', text: 'Moved to another group after this week'}));
    return {cells: [
      h('span', {class: 'nowrap', text: `W${w + 1}`, title: weekTitle(w)}),
      h('button', {class: 'linkbtn', type: 'button', text: grp.label, onclick: () => openDrawer({kind: 'group', strat, w, g})}),
      satPill(T.u[i]),
      T.resp[i] === 1 ? h('span', {class: 'nowrap'}, ratingPill(T.sat[i]), ' ', T.wma[i] ? 'keep' : h('strong', {text: 'switch'})) : '–',
      notes]};
  });
  const t = table([{label: 'Week'}, {label: 'Group', nowrap: true}, {label: 'Felt', num: true}, {label: 'Form', nowrap: true}, {label: 'What happened'}], rows);
  t.classList.add('top');
  return t;
}

function groupView(strat, w, g) {
  const T = D.trace[strat][w], grp = T.groups[g], m = grp.m, c = COURSES[ST.course[m[0]]];
  const us = m.map(i => T.u[i]);
  const unhappy = us.filter(u => u != null && u < 3).length, quit = m.filter(i => T.left[i] === 1).length, answered = m.filter(i => T.resp[i] === 1).length;
  const mpw = m.map(i => T.mpw[i]).find(v => v != null);
  const out = [];
  out.push(h('div', {class: 'dsec'},
    h('h2', {text: `${grp.label}, ${c.code}`}),
    h('p', {class: 'muted', text: `${SBY[strat].label} · ${weekTitle(w)} · ${grp.formed ? `formed after week ${grp.formed}` : 'formed at the start of the semester'}`}),
    h('div', {class: 'stats'},
      h('span', {class: 'chip'}, 'Felt ', satPill(avg(us))),
      h('span', {class: 'chip', text: `${unhappy} of ${m.length} unhappy`}),
      h('span', {class: 'chip', text: `${quit} quit`}),
      h('span', {class: 'chip', text: `${answered} of ${m.length} answered the form`}),
      mpw != null ? h('span', {class: 'chip', text: `met ${mpw}× this week`}) : null)));

  const hasLlm = m.some(i => T.llm[i]);
  out.push(h('section', {class: 'dsec'}, h('h3', {text: 'Members'}), h('div', {class: 'tbl-wrap'}, table(
    [{label: 'Student'}, {label: 'Felt', num: true}, {label: 'Rated', num: true}, {label: 'Keep?'}, {label: 'Came', num: true}],
    m.slice().sort((a, b) => (T.u[a] ?? 0) - (T.u[b] ?? 0)).map(i => ({onclick: () => openDrawer({kind: 'student', i}), cells: [
      h('span', {class: 'who'}, avatar(i), h('span', {class: 'who-name'}, studentLink(i),
        T.left[i] === 1 ? h('span', {class: 'small warn', text: 'quit this week'}) : h('span', {class: 'muted small', text: ST.major[i]}),
        T.llm[i] && T.llm[i][2] ? h('span', {class: 'quote', text: `“${T.llm[i][2]}”`}) : null)),
      satPill(T.u[i]), T.resp[i] === 1 ? ratingPill(T.sat[i]) : h('span', {class: 'muted small', text: 'no form'}),
      T.resp[i] === 1 ? (T.wma[i] ? 'Yes' : h('strong', {text: 'No'})) : '–',
      T.resp[i] === 1 ? `${T.att[i]}/${T.mpw[i]}` : '–']}))))));
  if (hasLlm) out.push(h('p', {class: 'muted small', text: 'Quotes are the LLM\'s one-line notes for each simulated student. "Felt" is after the clamp.'}));

  const story = T.stories && T.stories[g];
  if (story && story.length) {
    out.push(h('section', {class: 'dsec'}, h('h3', {text: 'What happened at the meetings'}),
      h('p', {class: 'muted small', text: 'Written by the LLM from who came, what the members are like and the previous meeting. The week\'s verdicts above were judged from these accounts.'}),
      story.map((m, k) => h('div', {class: 'story'},
        h('div', {class: 'story-head'}, h('strong', {text: `Meeting ${k + 1}`}), h('span', {class: 'muted small', text: cap(m.who)})),
        m.account ? h('p', {text: m.account}) : h('p', {class: 'muted small', text: 'No account: the call failed or the budget was spent, so the judge saw only who came.'}),
        Object.keys(m.exp || {}).length ? h('div', {}, Object.entries(m.exp).filter(([, e]) => e !== 'absent').map(([i, e]) => h('span', {class: 'tagchip', text: `${ST.name[i].split(' ')[0]} ${EXP_WORDS[e] || e}`}))) : null))));
  }

  const saw = strat === LEARN && grp.formed > 0 ? D.trace[LEARN][grp.formed - 1].prof : ST.survey;
  const heatBox = h('div', {class: 'tbl-wrap'});
  const drawHeat = which => {
    const P = which === 'truth' ? ST.truth : saw;
    const cell = v => { const a = 0.1 + (v - 1) / 4 * 0.8; return h('td', {style: `background:rgba(var(--heat),${a.toFixed(2)});color:${a > 0.55 ? 'var(--on-heat)' : 'var(--ink)'}`, text: v.toFixed(1)}); };
    const spread = AX.map((_, k) => { const vs = m.map(i => P[i][k]); return Math.max(...vs) - Math.min(...vs); });
    heatBox.replaceChildren(h('table', {class: 'heat'},
      h('thead', {}, h('tr', {}, h('th'), AX.map(a => h('th', {scope: 'col', title: D.axis_hints[a], text: FL[a].split(' ')[0]})))),
      h('tbody', {},
        m.map(i => h('tr', {}, h('th', {class: 'rowh', scope: 'row', text: ST.name[i].split(' ')[0]}), AX.map((_, k) => cell(P[i][k])))),
        h('tr', {class: 'spread'}, h('th', {class: 'rowh', scope: 'row', text: 'Spread'}), spread.map(s => h('td', {class: s >= 1.5 ? 'wide' : null, title: 'Highest minus lowest in the group', text: s.toFixed(1)}))))));
  };
  drawHeat('saw');
  out.push(h('section', {class: 'dsec'}, h('h3', {text: 'Traits side by side'}),
    h('p', {class: 'muted small', text: `Darker means higher, on a 1-5 scale. "What the matcher saw" is ${strat === LEARN && grp.formed > 0 ? `its learned view when it formed this group, after week ${grp.formed}` : 'the survey answers'}. A wide spread is where the group differs most.`}),
    seg('View', [['saw', 'What the matcher saw'], ['truth', 'Hidden truth']], 'saw', drawHeat), heatBox));

  const tagCount = new Map();
  for (const i of m) for (const t of (T.tags[i] || [])) tagCount.set(t, (tagCount.get(t) || 0) + 1);
  const avoids = m.flatMap(i => (T.avoid[i] || []).map(o => [i, o]));
  if (tagCount.size || avoids.length) {
    out.push(h('section', {class: 'dsec'}, h('h3', {text: 'Complaints on the forms'}),
      tagCount.size ? h('div', {}, [...tagCount].sort((a, b) => b[1] - a[1]).map(([t, n]) => h('span', {class: 'tagchip', text: `${tagLabel(t)}${n > 1 ? ` ×${n}` : ''}`}))) : null,
      avoids.map(([a, b]) => h('p', {class: 'small'}, studentLink(a), ' asked not to be grouped with ', studentLink(b), ' again.'))));
  }
  if (w < W - 1 && strat !== 'stay') {
    const movers = m.filter(i => movedSets[strat][w].has(i));
    out.push(h('section', {class: 'dsec'}, h('h3', {text: 'After this week'}),
      h('p', {}, movers.length === 0 ? 'Everyone stayed together.'
        : movers.length === m.length ? 'The group was dissolved and everyone was placed in new groups.'
        : [movers.length === 1 ? 'One member moved: ' : `${movers.length} members moved: `, movers.map((i, k) => [k ? ', ' : '', studentLink(i)]), '.'])));
  }
  return out;
}

/* ---------- Feedback forms ---------- */
const fb = Object.assign({strat: LEARN, week: -1, low: false, q: '', page: 0}, store.get('feedback', {}));
if (fb.week > W - 1) fb.week = -1;
if (!SBY[fb.strat]) fb.strat = LEARN;
function renderFeedback(root) {
  root.replaceChildren();
  if (!W) { root.append(notYet()); return; }
  root.append(h('div', {class: 'section-head'}, h('div', {},
    h('h2', {text: 'Feedback forms'}),
    h('p', {text: `Everything students wrote${SEEDS > 1 ? ' (seed 0)' : ''}: a short pulse every week, and a longer check-in with peer ratings every ${CHECKIN} weeks. This is all the app could ever see; the hidden truth sits beside it for comparison.`}))));
  root.append(h('div', {class: 'card flat controls'},
    stratSeg(fb.strat, v => { fb.strat = v; fb.page = 0; draw(); }),
    weekPicker(fb.week, v => { fb.week = v; fb.page = 0; draw(); }, true)));
  const body = h('div', {class: 'stack'});
  root.append(body);

  function draw() {
    store.set('feedback', fb);
    const weeks = fb.week < 0 ? range(W) : [fb.week];
    const forms = [];
    let grouped = 0;
    for (const w of weeks) {
      const T = D.trace[fb.strat][w];
      for (let i = 0; i < N; i++) {
        if (T.g[i] >= 0) grouped++;
        if (T.resp[i] === 1) forms.push({i, w, T});
      }
    }
    const sats = forms.map(f => f.T.sat[f.i]), felt = forms.map(f => f.T.u[f.i]);
    const keep = forms.filter(f => f.T.wma[f.i] === 1).length;
    const complaints = forms.filter(f => f.T.tags[f.i]).length;
    const avoiders = forms.filter(f => f.T.avoid[f.i]).length;
    const scope = fb.week < 0 ? `all ${W} weeks` : `week ${fb.week + 1}`;
    const tiles = h('div', {class: 'grid-4'},
      h('div', {class: 'card tile'}, h('span', {class: 'tile-l', text: 'Forms answered'}), h('span', {class: 'tile-v', text: forms.length.toLocaleString('en-US')}),
        h('span', {class: 'tile-c', text: `${FMT.pct(grouped ? forms.length / grouped : 0)} of grouped students, ${scope}`})),
      h('div', {class: 'card tile'}, h('span', {class: 'tile-l', text: 'Said vs. felt'}), h('span', {class: 'tile-v', text: `${FMT.sat(avg(sats))} / ${FMT.sat(avg(felt))}`}),
        h('span', {class: 'tile-c', text: 'Average rating on the form, then the same students\' hidden satisfaction'})),
      h('div', {class: 'card tile'}, h('span', {class: 'tile-l', text: 'Would keep their group'}), h('span', {class: 'tile-v', text: FMT.pct(forms.length ? keep / forms.length : 0)}),
        h('span', {class: 'tile-c', text: `${(forms.length - keep).toLocaleString('en-US')} answers asked for a new group`})),
      h('div', {class: 'card tile'}, h('span', {class: 'tile-l', text: 'Complained'}), h('span', {class: 'tile-v', text: complaints.toLocaleString('en-US')}),
        h('span', {class: 'tile-c', text: `${avoiders} also named someone to avoid`})));

    const said = [1, 2, 3, 4, 5].map(k => sats.filter(v => v === k).length / (sats.length || 1));
    const real = [1, 2, 3, 4, 5].map(k => felt.filter(v => Math.min(5, Math.max(1, Math.round(v))) === k).length / (felt.length || 1));
    const distSeries = [{label: 'On the form', color: 'var(--viz)', values: said}, {label: 'How they really felt (rounded)', color: 'var(--viz-2)', values: real}];
    const distFig = figure({title: 'Ratings on the form vs. how students really felt',
      sub: 'Share of answered forms at each rating. Students round up, so the form looks rosier than the truth.',
      legend: legend(distSeries.map(s => ({label: s.label, color: s.color, kind: 'rect'}))),
      body: columnChart({categories: ['1', '2', '3', '4', '5'], series: distSeries, format: 'pct', tipTitle: c => `Rating ${c + 1}`, aria: 'Distribution of ratings'}),
      table: () => table([{label: 'Rating'}, ...distSeries.map(s => ({label: s.label, num: true}))], [1, 2, 3, 4, 5].map((k, c) => ({cells: [String(k), FMT.pct(said[c]), FMT.pct(real[c])]})))});

    const tagN = new Map();
    for (const f of forms) for (const t of (f.T.tags[f.i] || [])) tagN.set(t, (tagN.get(t) || 0) + 1);
    const tagRows = [...tagN].sort((a, b) => b[1] - a[1]).map(([t, n]) => ({label: tagLabel(t), value: n, text: `${n} · ${FMT.pct(n / (complaints || 1))}`}));
    const tagFig = figure({title: 'What students said would help',
      sub: 'Asked when a student rated the group 3 or lower. A form can name up to two things. Percent of forms that complained.',
      body: tagRows.length ? barList(tagRows, {format: 'count'}) : h('p', {class: 'empty', text: 'No complaints in this selection.'})});

    const qFig = figure({title: 'What the form asks',
      sub: 'A blue dot marks what the learner uses. The two new questions aren\'t in the app yet; this simulation suggests adding them.',
      body: h('div', {class: 'tbl-wrap'}, table([{label: 'Question'}, {label: 'When', nowrap: true}, {label: 'Where the answer comes from'}, {label: 'What the learner does with it'}],
        D.form_fields.map(f => ({cells: [
          h('span', {}, h('strong', {text: f.question}), f.new ? h('span', {class: 'badge', style: 'margin-left:8px', text: 'New'}) : null),
          f.when, h('span', {class: 'small', text: f.produced}),
          h('span', {class: 'small'}, f.used ? h('span', {class: 'lg-k dot', style: `--c:${color(LEARN)};margin-right:6px`}) : null, f.use)]}))))});

    const tableBox = h('div', {class: 'stack'});
    const search = h('input', {class: 'input', type: 'search', id: 'forms-search', placeholder: 'Student or group', 'aria-label': 'Search forms', value: fb.q});
    search.addEventListener('input', () => { fb.q = search.value; fb.page = 0; drawTable(); });
