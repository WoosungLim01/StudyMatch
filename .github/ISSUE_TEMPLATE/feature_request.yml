name: Feature request
description: Suggest an idea for StudyMatch
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe it from a student's (or instructor's) point of view.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
