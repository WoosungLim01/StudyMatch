<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyMatch · Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* StudyMatch tokens — see Design.md */
  :root{
    --bg:#F1F3F9; --surface:#FFFFFF;
    --accent:#14213D; --accent-deep:#0A1B33; --accent-mid:#1B2A4A;
    --blue-2:#2C4770; --blue-3:#5C7EA6; --band:#E3E9F3;
    --ink:#1F2547; --muted-strong:rgba(31,37,71,.72); --muted:#8A90A8;
    --line-soft:#EEF0F6; --line:#E4E7F2; --line-strong:#D9DDEB;
    --tint:#E3E9F3;
    --danger:#8A3B42; --danger-soft:#F6EBEC;
    --font-display:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow-card:0 12px 40px rgba(76,86,150,.08);
    /* Login page only: editorial off-white page with a serif headline */
    --font-serif:"Fraunces",Georgia,"Times New Roman",serif;
    --page-editorial:#FAF9F5;   /* warm cream, Claude-like */
    --sidebar-bg:#F3F1EA;       /* areas are told apart by tone, not borders */
    --well:#F0EEE6;             /* tonal fill: bubbles, chips, quiet buttons */
    --well-strong:#E7E4DA;      /* hover / active fill */
    --ink-editorial:#1F1E1D;
    --text-soft:#5E5D59;   /* subheadline: 8.3:1 on --page-editorial */
    --muted-aa:#6B6A64;    /* fine print, "or": 5.9:1 on white (AA) */
    --radius-control:8px;
    --radius-panel:20px;
    --shadow-soft:0 1px 2px rgba(31,30,29,.04), 0 6px 24px rgba(31,30,29,.05);
    --hero-gap:32px;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--page-editorial);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}

  /* ── Left: brand, headline, auth card ── */
  .left{
    position:relative;display:flex;align-items:center;justify-content:center;
    padding:112px 48px 64px;
  }
  .brand{
    position:absolute;top:32px;left:40px;
    display:flex;align-items:center;gap:10px;font:800 22px/1 var(--font-display);color:var(--ink);letter-spacing:-.02em;
  }

  .stack{width:100%;max-width:440px;}
  .headline{
    margin:0;font:500 60px/1.05 var(--font-serif);letter-spacing:-.025em;color:var(--ink-editorial);
  }
  .subhead{margin:16px 0 40px;font-size:18px;line-height:1.5;color:var(--text-soft);}

  .card{
    background:var(--surface);border-radius:var(--radius-panel);
    box-shadow:var(--shadow-soft);padding:28px;
  }

  .btn-google{
    width:100%;height:44px;border-radius:var(--radius-control);cursor:pointer;
    background:var(--well);color:var(--ink-editorial);border:none;
    font:700 15px/1 var(--font-body);display:flex;align-items:center;justify-content:center;gap:10px;
    text-decoration:none;transition:background .15s, border-color .15s;
  }
  .btn-google:hover{background:var(--well-strong);}
  .btn-google:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .divider{margin:16px 0;text-align:center;color:var(--muted-aa);font-size:13px;font-weight:600;}

  .row{margin-bottom:12px;}
  input[type=email], input[type=password], input[type=text]{
    width:100%;height:44px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--well-strong);
    background:var(--surface);color:var(--ink-editorial);font:400 15px/1 var(--font-body);
    transition:border-color .15s, box-shadow .15s;
  }
  input::placeholder{color:var(--muted-aa);}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}  /* 1px border + 1px ring = 2px */
  input:focus-visible{outline:none;}

  .btn{
    position:relative;width:100%;height:44px;margin-top:4px;border-radius:var(--radius-control);cursor:pointer;
    background:var(--accent);color:#fff;border:none;
    font:700 15px/1 var(--font-body);display:flex;align-items:center;justify-content:center;gap:10px;
    transition:background .15s;
  }
  .btn:hover{background:var(--accent-deep);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn:disabled{opacity:.75;cursor:progress;}
  /* The button is only disabled while a request is in flight, so that's when the spinner shows. */
  .btn:disabled::before{
    content:"";width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .error{margin:-4px 0 12px;color:var(--danger);font-size:14px;font-weight:600;line-height:1.4;display:none;}
  .info{
    background:var(--tint);color:var(--accent);border-radius:var(--radius-control);
    padding:10px 14px;font-size:14px;font-weight:600;line-height:1.45;margin-bottom:12px;display:none;
  }
  .hint{font-size:13px;color:var(--muted-aa);margin:12px 0 0;text-align:center;}
  .link{background:none;border:none;padding:0;color:var(--accent);font:700 13px/1 var(--font-body);text-decoration:underline;cursor:pointer;}
  .link:focus-visible, .fine a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .fine{margin:20px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted-aa);text-align:center;}
  .fine a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  .fine a:hover{color:var(--ink-editorial);}

  /* ── Right: hero image ── */
  .right{padding:var(--hero-gap) var(--hero-gap) var(--hero-gap) 0;}
  .hero{
    position:sticky;top:var(--hero-gap);height:calc(100vh - 2 * var(--hero-gap));min-height:480px;
    border-radius:var(--radius-panel);overflow:hidden;background:var(--band);
  }
  .hero img{width:100%;height:100%;object-fit:cover;display:block;animation:fade-in .8s ease-out both;}
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    .hero img{animation:none;}
    .btn:disabled::before{animation-duration:2s;}
  }

  @media (max-width:1023px){
    :root{--hero-gap:20px;}
    .left{padding:104px 32px 56px;}
    .brand{left:32px;}
    .headline{font-size:44px;}
  }
  @media (max-width:767px){
    .page{grid-template-columns:1fr;}
    .right{display:none;}
    .left{display:block;padding:24px 16px 48px;}
    .brand{position:static;margin-bottom:48px;}
    .stack{max-width:none;}
    .headline{font-size:36px;}
    .subhead{font-size:17px;margin-bottom:28px;}
    .card{padding:24px 20px;}
  }
</style>
</head>
<body>

<div class="page">
  <main class="left">
    <div class="brand">
      StudyMatch
    </div>

    <div class="stack">
      <h1 class="headline">Study toward your future.</h1>
      <p class="subhead">Find the people who'll help you get there.</p>

      <div class="card">
        <a class="btn-google" href="/api/auth/google/login">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </a>

        <div class="divider">or</div>

        <form id="login-form">
          <div class="info" id="info" role="status"></div>
          <div class="row">
            <label class="sr-only" for="f-email">Email</label>
            <input type="email" id="f-email" required autocomplete="email" placeholder="Enter your PSU email" aria-describedby="error">
          </div>
          <div class="row">
            <label class="sr-only" for="f-password">Password</label>
            <input type="password" id="f-password" required autocomplete="current-password" minlength="6" placeholder="Password (at least 6 characters)" aria-describedby="error">
          </div>
          <div class="row" id="code-row" hidden>
            <label class="sr-only" for="f-code">Verification code</label>
            <input type="text" id="f-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit verification code" aria-describedby="error">
          </div>
          <div class="error" id="error" role="alert"></div>
          <button type="submit" class="btn" id="submit-btn">Continue with email</button>
          <p class="hint" id="resend-hint" hidden>Didn't get it? <button type="button" class="link" id="resend-btn">Send a new code</button></p>
        </form>

        <p class="fine">By continuing, you agree to StudyMatch's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      </div>
    </div>
  </main>

  <div class="right" aria-hidden="true">
    <div class="hero"><img src="/assets/Collaborative%20Study%20by%20the%20Window.png" alt="" onerror="this.remove()"></div>
  </div>
</div>

<script>
const API = '';

// A failed Google sign-in redirects back here with ?error=... rather than
// failing silently or dumping a server error page.
const urlError = new URLSearchParams(window.location.search).get('error');
if (urlError) {
  const errorEl = document.getElementById('error');
  errorEl.textContent = urlError;
  errorEl.style.display = 'block';
  window.history.replaceState({}, '', window.location.pathname);
}

const codeRow = document.getElementById('code-row');
const resendHint = document.getElementById('resend-hint');
let awaitingCode = false;

function showCodeStep(message) {
  awaitingCode = true;
  codeRow.hidden = false;
  resendHint.hidden = false;
  const infoEl = document.getElementById('info');
  infoEl.textContent = message;
  infoEl.style.display = 'block';
  document.getElementById('f-code').value = '';
  document.getElementById('f-code').focus();
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const infoEl = document.getElementById('info');
  errorEl.style.display = 'none';
  if (!awaitingCode) infoEl.style.display = 'none';

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Checking…';

  const payload = {
    email: document.getElementById('f-email').value.trim(),
    password: document.getElementById('f-password').value,
  };
  const url = awaitingCode ? '/api/auth/verify-code' : '/api/auth/login';
  if (awaitingCode) payload.code = document.getElementById('f-code').value.trim();

  try {
    const res = await fetch(API + url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || res.statusText);
    }
    const data = await res.json();
    if (data.status === 'code_sent') {
      showCodeStep(data.message);
      btn.disabled = false;
      btn.textContent = 'Verify code';
      return;
    }
    window.location.href = data.redirect;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = awaitingCode ? 'Verify code' : 'Continue with email';
  }
});

document.getElementById('resend-btn').addEventListener('click', () => {
  awaitingCode = false;
  codeRow.hidden = true;
  resendHint.hidden = true;
  document.getElementById('login-form').requestSubmit();
});
</script>
</body>
</html>
