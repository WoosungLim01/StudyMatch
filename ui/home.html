<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyMatch · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* StudyMatch tokens — see Design.md (same editorial tone as the login page) */
  :root{
    --bg:#F1F3F9; --surface:#FFFFFF;
    --accent:#14213D; --accent-deep:#0A1B33; --accent-mid:#1B2A4A;
    --blue-2:#2C4770; --blue-3:#5C7EA6; --band:#E3E9F3;
    --ink:#1F2547; --muted-strong:rgba(31,37,71,.72); --muted:#8A90A8;
    --line-soft:#EEF0F6; --line:#E4E7F2; --line-strong:#D9DDEB;
    --tint:#E3E9F3;
    --danger:#8A3B42; --danger-soft:#F6EBEC;
    --good:#2F6F4E; --good-soft:#EAF5EE;
    --font-display:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:"Fraunces",Georgia,"Times New Roman",serif;
    --page-editorial:#FAF9F5;   /* warm cream, Claude-like */
    --sidebar-bg:#F3F1EA;       /* areas are told apart by tone, not borders */
    --well:#F0EEE6;             /* tonal fill: bubbles, chips, quiet buttons */
    --well-strong:#E7E4DA;      /* hover / active fill */
    --ink-editorial:#1F1E1D;
    --text-soft:#5E5D59;
    --muted-aa:#6B6A64;
    --radius-control:8px;
    --radius-panel:20px;
    --shadow-soft:0 1px 2px rgba(31,30,29,.04), 0 6px 24px rgba(31,30,29,.05);
    --sidebar-w:248px;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;min-height:100vh;background:var(--page-editorial);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-serif);font-weight:500;color:var(--ink-editorial);margin:0;line-height:1.1;letter-spacing:-.02em;}

  /* ── App shell: sidebar + content ── */
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}
  .sidebar{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;
    padding:28px 16px 20px;background:var(--sidebar-bg);
  }
  .brand{padding:4px 12px;font:800 22px/1 var(--font-display);color:var(--ink);letter-spacing:-.02em;text-decoration:none;}
  .nav{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;
    border:none;border-radius:var(--radius-control);background:none;cursor:pointer;text-align:left;
    color:var(--text-soft);font:700 15px/1.25 var(--font-body);text-decoration:none;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item:hover{background:var(--well-strong);color:var(--ink-editorial);}
  .nav-item.active{background:var(--well-strong);color:var(--ink-editorial);}
  .nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .nav-item[aria-disabled="true"]{opacity:.55;cursor:default;pointer-events:none;}
  .nav-label{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-heading{display:block;padding:0 12px 6px;font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-aa);}
  .nav-empty{display:block;padding:6px 12px;font-size:13px;color:var(--muted-aa);}
  .nav-logout{margin-top:auto;}
  .content{min-width:0;}

  /* ── Shared: cards, badges, the course + chat room header ── */
  .card{background:var(--surface);border-radius:var(--radius-panel);box-shadow:var(--shadow-soft);padding:28px;}
  .card-label{display:block;font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-aa);margin-bottom:16px;}
  .badge{
    display:inline-block;flex:none;white-space:nowrap;padding:5px 10px;border-radius:999px;
    background:var(--tint);color:var(--accent);font:700 12px/1 var(--font-body);letter-spacing:.03em;
  }
  .room-id{display:flex;align-items:center;gap:10px;min-width:0;}
  .room-course{color:var(--text-soft);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:#fff;font:700 16px/1 var(--font-display);background:var(--accent);
  }
  .avatar.c2{background:var(--blue-2);}
  .avatar.c3{background:var(--blue-3);}
  .stack{display:flex;padding-left:10px;flex:none;}
  .stack .avatar{margin-left:-10px;border:2px solid var(--page-editorial);}

  @media (max-width:767px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .sidebar{
      position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:4px;
      padding:10px 12px;padding-top:max(10px, env(safe-area-inset-top));
    }
    .brand{margin-right:auto;padding:4px;font-size:19px;}
    .nav{display:flex;gap:2px;}
    .nav-item{width:auto;padding:10px;}
    .nav-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
    .nav-heading, .nav-empty{display:none;}
    .rooms{display:flex;}
    .nav-logout{margin-top:0;}
  }

  .page{max-width:880px;margin:0 auto;padding:48px 40px 64px;}
  .hero{margin-bottom:28px;}
  .greeting{font-size:42px;}
  .greeting-sub{color:var(--text-soft);margin:6px 0 0;font-size:16px;}
  .skeleton{color:var(--muted-aa);margin:0;}

  /* ── Group card: title + open button on one row, members as chips ── */
  .room-top{display:flex;justify-content:space-between;align-items:center;gap:20px;}
  .room-top > div{min-width:0;}
  .group-name{font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta{display:block;margin-top:4px;color:var(--muted-aa);font-size:14px;font-weight:600;}

  .member-list{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;}
  .member-list li{
    display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;
    background:var(--well);font-weight:600;font-size:14px;color:var(--ink-editorial);
  }
  .member-list .avatar{width:28px;height:28px;font-size:12px;}
  .member-list li.empty{background:none;border:none;padding:0;font-weight:400;color:var(--muted-aa);}

  .btn-primary{
    flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;
    background:var(--accent);color:#fff;border-radius:var(--radius-control);text-decoration:none;
    font:700 15px/1 var(--font-body);transition:background .15s;
  }
  .btn-primary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .pending{display:flex;gap:16px;align-items:flex-start;}
  .pending h2{font-size:24px;margin-bottom:4px;}
  .pending p{margin:0;color:var(--text-soft);font-size:15px;}
  .icon-box{
    width:44px;height:44px;flex:none;display:grid;place-items:center;
    border-radius:10px;background:var(--tint);color:var(--accent);
  }
  .icon-box svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  @media (max-width:1023px){
    .page{padding:40px 28px 56px;}
  }
  @media (max-width:767px){
    .page{padding:24px 16px 48px;}
    .greeting{font-size:34px;}
    .card{padding:20px 18px;}
    .room-top{flex-direction:column;align-items:stretch;}
    .group-name{font-size:24px;white-space:normal;}
    .btn-primary{justify-content:center;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/home">StudyMatch</a>
    <nav class="nav" aria-label="Main">
      <a class="nav-item active" aria-current="page" href="/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Home</span></a>
      <a class="nav-item" href="/account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span class="nav-label">Account</span></a>
    </nav>
    <div class="rooms">
      <span class="nav-heading">Chat rooms</span>
      <nav class="nav" aria-label="Chat rooms">
        <a class="nav-item" id="nav-chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12z"/></svg><span class="nav-label" id="nav-chat-name"></span></a>
        <span class="nav-empty" id="nav-chat-empty">Loading…</span>
      </nav>
    </div>
    <button class="nav-item nav-logout" id="logout-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M14 16l4-4-4-4"/><path d="M18 12H9"/></svg><span class="nav-label">Log out</span></button>
  </aside>

  <main class="content">
    <div class="page">
      <div class="hero" id="greeting-card">
        <p class="skeleton">Loading…</p>
      </div>

      <section class="card" id="group-card" style="display:none;">
        <span class="card-label">Your chat room</span>
        <div id="group-content"></div>
      </section>
    </div>
  </main>
</div>

<script>
const API = '';

const AVATAR_COLORS = ['', 'c2', 'c3'];
function initial(name){ return esc((name || '?').trim().charAt(0).toUpperCase()); }
// Names, emails and group names are user-controlled (anyone can set their
// display name on /account) - escape before they go into innerHTML, or a
// name like <img onerror=...> runs script in every groupmate's browser.
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const res = await fetch(API + '/api/home');
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (!res.ok) {
    document.getElementById('greeting-card').innerHTML = '<p class="skeleton">Something went wrong loading your info.</p>';
    setChatNav(null);
    return;
  }
  const data = await res.json();
  setChatNav(data.status === 'grouped' ? data.group_id : null, data.group_name);

  document.getElementById('greeting-card').innerHTML = `
    <h1 class="greeting">Hey, ${esc(data.name.split(' ')[0])}.</h1>
    <p class="greeting-sub">${esc(data.email)}</p>
  `;

  const groupCard = document.getElementById('group-card');
  const groupContent = document.getElementById('group-content');
  groupCard.style.display = 'block';
  if (data.status === 'grouped') {
    const members = data.members || [];
    const course = data.course_title ? `${esc(data.course_title)} · ` : '';
    groupContent.innerHTML = `
      <div class="room-top">
        <div>
          <h2 class="group-name">${esc(data.group_name)}</h2>
          <span class="meta">${course}${members.length + 1} members · Compatibility ${esc(data.group_score)}</span>
        </div>
        <a class="btn-primary" href="/chat?group=${encodeURIComponent(data.group_id)}">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12z"/></svg>
          Open chat room
        </a>
      </div>
      <ul class="member-list">
        ${members.map((m, i) => `<li><div class="avatar ${AVATAR_COLORS[i % 3]}">${initial(m)}</div>${esc(m)}</li>`).join('') || '<li class="empty">No other members yet</li>'}
      </ul>
    `;
  } else {
    groupContent.innerHTML = `
      <div class="pending">
        <div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
        <div>
          <h2>You're on the waiting list</h2>
          <p>No group had room right now. As more students join, you'll be matched automatically and your chat room shows up here.</p>
        </div>
      </div>
    `;
  }
}
load();

// ── Sidebar ──
function setChatNav(groupId, groupName){
  const link = document.getElementById('nav-chat');
  const empty = document.getElementById('nav-chat-empty');
  if (!groupId) { empty.textContent = 'None yet'; return; }
  link.href = '/chat?group=' + encodeURIComponent(groupId);
  link.title = groupName;
  document.getElementById('nav-chat-name').textContent = groupName;
  link.hidden = false;
  empty.hidden = true;
}
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
});
</script>
</body>
</html>
