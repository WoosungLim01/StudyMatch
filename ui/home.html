<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyMatch · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* StudyMatch tokens — see Design.md */
  :root{
    --bg:#EEF2F8; --surface:#FFFFFF;
    --navy:#14213D; --navy-deep:#0A1B33; --navy-mid:#1B2A4A;
    --blue-2:#2C4770; --blue-3:#5C7EA6; --band:#DCE6F5;
    --ink:#1B2A41; --muted-strong:rgba(27,42,65,.72); --muted:rgba(27,42,65,.55);
    --line-soft:rgba(27,42,65,.06); --line:rgba(27,42,65,.08); --line-strong:rgba(27,42,65,.12);
    --tint:rgba(20,33,61,.10);
    --font-display:"Fraunces",Georgia,"Times New Roman",serif;
    --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow-card:0 8px 24px rgba(27,42,65,.08);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:var(--font-display);color:var(--navy);margin:0;line-height:1.15;letter-spacing:-.01em;}

  /* ── Top bar ── */
  .topbar{
    position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
  }
  .topbar-inner{max-width:1040px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--font-display);color:var(--navy);}
  .brand-mark{width:36px;height:36px;border-radius:12px;background:var(--navy);display:grid;place-items:center;}
  .brand-mark svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .btn-ghost{
    background:transparent;color:var(--navy);border:2px solid var(--navy);border-radius:999px;
    padding:8px 20px;font:700 14px/1 var(--font-body);cursor:pointer;transition:background .15s;
  }
  .btn-ghost:hover{background:var(--tint);}
  .btn-ghost:focus-visible{outline:3px solid var(--blue-3);outline-offset:3px;}

  main{max-width:1040px;margin:0 auto;padding:56px 24px 96px;}

  /* ── Greeting ── */
  .hero{margin-bottom:36px;}
  .greeting{font-size:48px;font-weight:700;}
  .greeting-sub{color:var(--muted);margin:8px 0 0;font-size:16px;}
  .skeleton{color:var(--muted);margin:0;}

  /* ── Layout ── */
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start;}
  .side{display:grid;gap:24px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-card);padding:32px;}

  .badge{
    display:inline-block;padding:6px 12px;border-radius:999px;
    background:var(--tint);color:var(--navy);font:700 13px/1 var(--font-body);letter-spacing:.02em;
  }
  .card-label{display:block;font:700 13px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}

  .icon-box{
    width:56px;height:56px;flex:none;display:grid;place-items:center;
    border-radius:16px;background:var(--tint);color:var(--navy);
  }
  .icon-box svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ── Group ── */
  .group-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:28px;}
  .group-name{font-size:32px;margin-bottom:12px;}
  .stack{display:flex;padding-left:12px;}
  .stack .avatar{margin-left:-12px;border:3px solid var(--surface);}

  .avatar{
    width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:#fff;font:700 19px/1 var(--font-display);background:var(--navy);
  }
  .avatar.c2{background:var(--blue-2);}
  .avatar.c3{background:var(--blue-3);}

  .member-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .member-list li{
    display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;
    background:var(--bg);font-weight:700;color:var(--ink);
  }
  .member-list li.empty{background:none;padding:0;font-weight:400;color:var(--muted);}

  .card.clickable{cursor:pointer;transition:box-shadow .15s,transform .15s;}
  .card.clickable:hover{box-shadow:0 12px 32px rgba(27,42,65,.14);transform:translateY(-2px);}
  .card.clickable:focus-visible{outline:3px solid var(--blue-3);outline-offset:3px;}
  .btn-primary{
    display:inline-flex;align-items:center;gap:8px;margin-top:24px;
    background:var(--navy);color:#fff;border:none;border-radius:999px;text-decoration:none;
    padding:12px 22px;font:700 15px/1 var(--font-body);
  }
  .btn-primary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .card.clickable:hover .btn-primary{background:var(--navy-mid);}

  .pending{display:flex;gap:18px;align-items:flex-start;}
  .pending h3{font-size:22px;margin-bottom:6px;}
  .pending p{margin:0;color:var(--muted-strong);}

  /* ── Course ── */
  .course-line{display:flex;gap:16px;align-items:center;}
  .course-code{margin-bottom:8px;}
  .course-title{font:600 20px/1.3 var(--font-display);color:var(--navy);}

  /* ── Admin groups ── */
  .group-links{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
  .group-link{
    display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;
    background:var(--bg);color:var(--ink);text-decoration:none;transition:background .15s;
  }
  .group-link:hover{background:var(--band);}
  .group-link:focus-visible{outline:3px solid var(--blue-3);outline-offset:2px;}
  .group-link .icon-box{width:40px;height:40px;border-radius:12px;}
  .group-link .icon-box svg{width:20px;height:20px;}
  .group-link-name{display:block;font-weight:700;overflow-wrap:anywhere;}
  .group-link-meta{display:block;font-size:13px;color:var(--muted);}

  /* ── Tip band ── */
  .tip{background:var(--band);border-radius:24px;padding:28px;}
  .tip h3{font-size:20px;margin-bottom:6px;}
  .tip p{margin:0;color:var(--muted-strong);font-size:15px;}

  @media (max-width:860px){
    .grid{grid-template-columns:1fr;}
    .greeting{font-size:36px;}
  }
  @media (max-width:560px){
    main{padding:36px 16px 64px;}
    .card{padding:24px;}
    .member-list{grid-template-columns:1fr;}
    .group-name{font-size:26px;}
    .topbar-inner{padding:12px 16px;gap:10px;}
    .brand{font-size:19px;gap:8px;}
    .brand-mark{width:32px;height:32px;border-radius:10px;}
    .btn-ghost{padding:8px 12px;white-space:nowrap;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8.2 4.5 4 4.5v13c4.2 0 6.5.5 8 2 1.5-1.5 3.8-2 8-2v-13c-4.2 0-6.5.5-8 2z"/><path d="M12 6.5v13"/></svg></span>
      StudyMatch
    </div>
    <div style="display:flex;gap:10px;">
      <a class="btn-ghost" href="/account" style="text-decoration:none;display:inline-flex;align-items:center;">Account</a>
      <button class="btn-ghost" id="logout-btn">Log out</button>
    </div>
  </div>
</header>

<main>
  <div class="hero" id="greeting-card">
    <p class="skeleton">Loading…</p>
  </div>

  <div class="grid">
    <section class="card" id="group-card" style="display:none;">
      <span class="card-label">Your study group</span>
      <div id="group-content"></div>
    </section>

    <div class="side">
      <section class="card" id="admin-groups-card" style="display:none;">
        <span class="card-label">Admin groups</span>
        <ul class="group-links" id="admin-groups"></ul>
      </section>

      <section class="card" id="course-card" style="display:none;">
        <span class="card-label">Course</span>
        <div class="course-line" id="course-content"></div>
      </section>

      <section class="tip">
        <h3>Break the ice</h3>
        <p>Say hi to your group and pick a spot, whether that's Pattee, the HUB, or a Zoom link. The first session is the hardest one to schedule.</p>
      </section>
    </div>
  </div>
</main>

<script>
const API = '';

const AVATAR_COLORS = ['', 'c2', 'c3'];
function initial(name){ return esc((name || '?').trim().charAt(0).toUpperCase()); }
// Names, emails and group names are user-controlled (anyone can set their
// display name on /account) - escape before they go into innerHTML, or a
// name like <img onerror=...> runs script in every groupmate's browser.
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load(){
  const res = await fetch(API + '/api/home');
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (!res.ok) {
    document.getElementById('greeting-card').innerHTML = '<p class="skeleton">Something went wrong loading your info.</p>';
    return;
  }
  const data = await res.json();

  document.getElementById('greeting-card').innerHTML = `
    <h1 class="greeting">Hey, ${esc(data.name.split(' ')[0])}.</h1>
    <p class="greeting-sub">${esc(data.email)}</p>
  `;

  const groupCard = document.getElementById('group-card');
  const groupContent = document.getElementById('group-content');
  groupCard.style.display = 'block';
  if (data.status === 'grouped') {
    const members = data.members || [];
    groupContent.innerHTML = `
      <div class="group-top">
        <div>
          <h2 class="group-name">${esc(data.group_name)}</h2>
          <span class="badge">Compatibility ${esc(data.group_score)}</span>
        </div>
        <div class="stack" aria-hidden="true">
          ${members.slice(0, 5).map((m, i) => `<div class="avatar ${AVATAR_COLORS[i % 3]}">${initial(m)}</div>`).join('')}
        </div>
      </div>
      <ul class="member-list">
        ${members.map((m, i) => `<li><div class="avatar ${AVATAR_COLORS[i % 3]}">${initial(m)}</div>${esc(m)}</li>`).join('') || '<li class="empty">No other members yet</li>'}
      </ul>
      <a class="btn-primary" href="/chat?group=${encodeURIComponent(data.group_id)}">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12z"/></svg>
        Open group chat
      </a>
    `;
    // The whole card opens the chat, not just the button.
    const chatUrl = '/chat?group=' + encodeURIComponent(data.group_id);
    groupCard.classList.add('clickable');
    groupCard.tabIndex = 0;
    groupCard.setAttribute('role', 'link');
    groupCard.addEventListener('click', e => { if (!e.target.closest('a')) window.location.href = chatUrl; });
    groupCard.addEventListener('keydown', e => { if (e.key === 'Enter') window.location.href = chatUrl; });
  } else {
    groupContent.innerHTML = `
      <div class="pending">
        <div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
        <div>
          <h3>You're on the waiting list</h3>
          <p>No group had room right now. As more students join, you'll be matched automatically, so there's nothing else you need to do.</p>
        </div>
      </div>
    `;
  }

  if (data.course_code) {
    const courseCard = document.getElementById('course-card');
    courseCard.style.display = 'block';
    document.getElementById('course-content').innerHTML = `
      <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h5"/></svg></div>
      <div>
        <span class="badge course-code">${esc(data.course_code)}</span>
        <div class="course-title">${esc(data.course_title)}</div>
      </div>
    `;
  }

  const adminGroups = data.admin_groups || [];
  if (adminGroups.length) {
    document.getElementById('admin-groups-card').style.display = 'block';
    document.getElementById('admin-groups').innerHTML = adminGroups.map(g => `
      <li>
        <a class="group-link" href="/chat?group=${encodeURIComponent(g.group_id)}">
          <span class="icon-box"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12z"/></svg></span>
          <span>
            <span class="group-link-name">${esc(g.group_name)}</span>
            <span class="group-link-meta">${esc(g.member_count)} members · open chat</span>
          </span>
        </a>
      </li>
    `).join('');
  }
}
load();

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch(API + '/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
});
</script>
</body>
</html>
