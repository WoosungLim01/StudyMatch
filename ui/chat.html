<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyMatch · Group chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* StudyMatch tokens — see Design.md */
  :root{
    --bg:#EEF2F8; --surface:#FFFFFF;
    --navy:#14213D; --navy-deep:#0A1B33; --navy-mid:#1B2A4A;
    --blue-2:#2C4770; --blue-3:#5C7EA6; --band:#DCE6F5;
    --ink:#1B2A41; --muted-strong:rgba(27,42,65,.72); --muted:rgba(27,42,65,.55);
    --line-soft:rgba(27,42,65,.06); --line:rgba(27,42,65,.08); --line-strong:rgba(27,42,65,.12);
    --tint:rgba(20,33,61,.10);
    --font-display:"Fraunces",Georgia,"Times New Roman",serif;
    --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow-card:0 8px 24px rgba(27,42,65,.08);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100dvh;
  }
  h1,h2{font-family:var(--font-display);color:var(--navy);margin:0;line-height:1.15;letter-spacing:-.01em;}

  /* ── Top bar ── */
  .topbar{
    flex:none;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
  }
  .topbar-inner{max-width:820px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;}
  .back{
    display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;
    border-radius:50%;color:var(--navy);text-decoration:none;transition:background .15s;
  }
  .back:hover{background:var(--tint);}
  .back:focus-visible{outline:3px solid var(--blue-3);outline-offset:2px;}
  .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .title{flex:1;min-width:0;}
  .title h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stack{display:flex;padding-left:10px;flex:none;}
  .stack .avatar{margin-left:-10px;border:2px solid var(--surface);}

  .avatar{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:#fff;font:700 14px/1 var(--font-display);background:var(--navy);
  }
  .avatar.c2{background:var(--blue-2);}
  .avatar.c3{background:var(--blue-3);}

  /* ── Messages ── */
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;}
  .messages{max-width:820px;margin:0 auto;padding:24px 24px 12px;display:flex;flex-direction:column;}
  .status{margin:auto;padding:48px 16px;text-align:center;color:var(--muted);}
  .status h2{font-size:22px;margin-bottom:6px;}

  .day{
    align-self:center;margin:16px 0 12px;padding:4px 12px;border-radius:999px;
    background:var(--tint);color:var(--muted-strong);font:700 12px/1.4 var(--font-body);letter-spacing:.02em;
  }
  .row{display:flex;gap:10px;align-items:flex-end;margin-top:2px;}
  .row.first{margin-top:12px;}
  .row .avatar{visibility:hidden;}
  .row.last .avatar{visibility:visible;}
  .row.me{flex-direction:row-reverse;}
  .row.me .avatar{display:none;}
  .body{display:flex;flex-direction:column;max-width:min(560px,78%);}
  .row.me .body{align-items:flex-end;}
  .sender{font:700 13px/1.2 var(--font-body);color:var(--muted-strong);margin:0 0 4px 12px;}
  .bubble{
    padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .row.me .bubble{background:var(--navy);border-color:var(--navy);color:#fff;}
  .row:not(.me):not(.last) .bubble{border-bottom-left-radius:6px;}
  .row:not(.me):not(.first) .bubble{border-top-left-radius:6px;}
  .row.me:not(.last) .bubble{border-bottom-right-radius:6px;}
  .row.me:not(.first) .bubble{border-top-right-radius:6px;}
  .time{font-size:11px;color:var(--muted);margin:4px 8px 0;}

  /* ── Composer ── */
  .composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
  .composer form{max-width:820px;margin:0 auto;padding:12px 24px;display:flex;gap:10px;align-items:flex-end;}
  .composer textarea{
    flex:1;resize:none;max-height:160px;min-height:46px;padding:12px 16px;border-radius:23px;
    border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);
    font:400 16px/1.4 var(--font-body);
  }
  .composer textarea:focus{outline:none;border-color:var(--blue-3);box-shadow:0 0 0 3px rgba(92,126,166,.25);}
  .send{
    width:46px;height:46px;flex:none;border:none;border-radius:50%;cursor:pointer;
    background:var(--navy);color:#fff;display:grid;place-items:center;transition:background .15s,opacity .15s;
  }
  .send:hover{background:var(--navy-mid);}
  .send:disabled{opacity:.4;cursor:default;}
  .send:focus-visible{outline:3px solid var(--blue-3);outline-offset:2px;}
  .send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .error{max-width:820px;margin:0 auto;padding:0 24px 8px;color:#B42318;font-size:13px;}
  .error:empty{display:none;}

  @media (max-width:560px){
    .topbar-inner{padding:10px 16px;gap:10px;}
    .stack{display:none;}
    .messages{padding:16px 16px 8px;}
    .composer form{padding:10px 16px;}
    .error{padding:0 16px 8px;}
    .body{max-width:85%;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="back" href="/home" aria-label="Back to home">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="title">
      <h1 id="group-name">Group chat</h1>
      <p id="group-sub">Loading…</p>
    </div>
    <div class="stack" id="member-stack" aria-hidden="true"></div>
  </div>
</header>

<div class="scroll" id="scroll">
  <div class="messages" id="messages" aria-live="polite">
    <div class="status"><p>Loading messages…</p></div>
  </div>
</div>

<div class="composer">
  <div class="error" id="error" role="alert"></div>
  <form id="composer">
    <textarea id="input" rows="1" maxlength="1000" placeholder="Message your group" aria-label="Message" disabled></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg>
    </button>
  </form>
</div>

<script>
const POLL_MS = 3000;
const GROUP_ID = new URLSearchParams(location.search).get('group');
const BASE = '/api/groups/' + encodeURIComponent(GROUP_ID || '');

const AVATAR_COLORS = ['', 'c2', 'c3'];
const colorFor = {};   // student id -> avatar color class, stable for the page's lifetime
function color(id){ return colorFor[id] ??= AVATAR_COLORS[Object.keys(colorFor).length % 3]; }
function initial(name){ return (name || '?').trim().charAt(0).toUpperCase(); }

const scrollEl = document.getElementById('scroll');
const listEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const errorEl = document.getElementById('error');

let lastId = 0;
let lastMsg = null;      // previous rendered message, for grouping consecutive bubbles
let lastRow = null;
let polling = false;
let repoll = false;      // a poll was requested while one was in flight
let timer = null;
let sending = false;     // guards against a double Enter re-sending the same text

const CONN_ERROR = "Couldn't reach the server. Retrying…";
// Only the poller's own error is cleared by a successful poll - a send error
// ("Messages are limited to ...") stays until the next send attempt.
function setError(msg){ errorEl.textContent = msg; }
function clearConnError(){ if (errorEl.textContent === CONN_ERROR) setError(''); }

// 401 -> log in again; 403/404 -> not your group, back home.
function bounce(res){
  if (res.status === 401) { location.href = '/login'; return true; }
  if (res.status === 403 || res.status === 404) { location.href = '/home'; return true; }
  return false;
}

function dayLabel(d){
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
const timeLabel = d => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // textContent, never innerHTML - message text is user input
  return e;
}

function nearBottom(){ return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function toBottom(){ scrollEl.scrollTop = scrollEl.scrollHeight; }

function render(messages){
  if (!messages.length) return;
  if (lastId === 0) listEl.innerHTML = '';
  for (const m of messages) {
    const at = new Date(m.created_at);
    const prevAt = lastMsg && new Date(lastMsg.created_at);
    const newDay = !prevAt || prevAt.toDateString() !== at.toDateString();
    // Same sender within 5 minutes on the same day -> one visual cluster.
    const continues = lastMsg && !newDay && lastMsg.sender_id === m.sender_id
                      && at - prevAt < 5 * 60 * 1000;

    if (newDay) listEl.appendChild(el('div', 'day', dayLabel(at)));
    if (continues) {
      lastRow.classList.remove('last');
      lastRow.querySelector('.time')?.remove();
    }

    const row = el('div', 'row last' + (m.is_me ? ' me' : '') + (continues ? '' : ' first'));
    row.appendChild(el('div', 'avatar ' + color(m.sender_id), initial(m.name)));
    const body = el('div', 'body');
    if (!continues && !m.is_me) body.appendChild(el('div', 'sender', m.name));
    body.appendChild(el('div', 'bubble', m.text));
    body.appendChild(el('div', 'time', timeLabel(at)));
    row.appendChild(body);
    listEl.appendChild(row);

    lastMsg = m; lastRow = row; lastId = m.message_id;
  }
}

async function poll(){
  if (polling) { repoll = true; return; }
  polling = true;
  try {
    const res = await fetch(`${BASE}/messages?after=${lastId}`);
    if (bounce(res)) return;
    if (!res.ok) throw new Error();
    const { messages } = await res.json();
    const first = lastId === 0;
    const stick = first || nearBottom();
    if (first && !messages.length) {
      listEl.innerHTML = '<div class="status"><h2>No messages yet</h2><p>Say hi and pick a time for your first session.</p></div>';
    }
    render(messages);
    if (stick) toBottom();
    clearConnError();
  } catch {
    setError(CONN_ERROR);
  } finally {
    polling = false;
    if (repoll) { repoll = false; poll(); }
  }
}

// Poll only while the tab is visible; catch up immediately on return.
function schedule(){
  clearInterval(timer);
  timer = document.hidden ? null : setInterval(poll, POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); schedule(); });

async function loadGroup(){
  const res = await fetch(BASE);
  if (bounce(res)) return false;
  if (!res.ok) { document.getElementById('group-sub').textContent = 'Something went wrong loading this group.'; return false; }
  const g = await res.json();
  document.getElementById('group-name').textContent = g.group_name;
  document.title = `StudyMatch · ${g.group_name}`;
  const names = g.members.map(m => m.is_me ? 'You' : m.name.split(' ')[0]);
  document.getElementById('group-sub').textContent = `${g.course_code} · ${names.join(', ')}`;
  const stack = document.getElementById('member-stack');
  g.members.filter(m => !m.is_me).forEach(m => {
    stack.appendChild(el('div', 'avatar ' + color(m.student_id), initial(m.name)));
  });
  return true;
}

// ── Composer ──
function autosize(){ input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
function updateSend(){ sendBtn.disabled = sending || !input.value.trim(); }
input.addEventListener('input', () => { autosize(); updateSend(); });
// Enter sends, Shift+Enter is a newline. Skip while an IME is composing (e.g. Korean
// input): isComposing covers Chrome/Firefox; Safari instead reports the Enter that
// commits the composition as keyCode 229 with isComposing already false.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); document.getElementById('composer').requestSubmit(); }
});

document.getElementById('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sending) return;
  sending = true;
  updateSend();
  try {
    const res = await fetch(`${BASE}/messages`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
    });
    if (bounce(res)) return;
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      setError(typeof err.detail === 'string' ? err.detail : "Couldn't send. Try again.");
      return;
    }
    setError('');
    input.value = ''; autosize();
    await poll();
    toBottom();
  } catch {
    setError("Couldn't send. Try again.");
  } finally {
    sending = false;
    updateSend();
  }
  input.focus();
});

(async () => {
  if (!GROUP_ID) { location.href = '/home'; return; }
  if (!await loadGroup()) return;
  await poll();
  input.disabled = false;
  input.focus();
  schedule();
})();
</script>
</body>
</html>
