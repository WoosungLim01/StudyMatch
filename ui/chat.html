<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  /* Theme: saved choice ("light"/"dark") or the OS setting. Runs before the
     styles paint so a dark-mode visitor never sees a white flash. */
  (function(){
    var saved; try { saved = localStorage.getItem('theme'); } catch (e) {}
    var media = matchMedia('(prefers-color-scheme: dark)');
    function apply(){
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (media.matches ? 'dark' : 'light');
    }
    apply();
    media.addEventListener('change', apply);
    window.setTheme = function(choice){
      saved = choice;
      try { choice === 'system' ? localStorage.removeItem('theme') : localStorage.setItem('theme', choice); } catch (e) {}
      apply();
    };
    window.getTheme = function(){ return saved === 'light' || saved === 'dark' ? saved : 'system'; };
  })();
</script>
<title>StudyMatch · Chat room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* StudyMatch tokens — see Design.md (same editorial tone as the login page) */
  :root{
    --bg:#F1F3F9; --surface:#FFFFFF;
    --accent:#14213D; --accent-deep:#0A1B33; --accent-mid:#1B2A4A;
    --blue-2:#2C4770; --blue-3:#5C7EA6; --band:#E3E9F3;
    --ink:#1F2547; --muted-strong:rgba(31,37,71,.72); --muted:#8A90A8;
    --line-soft:#EEF0F6; --line:#E4E7F2; --line-strong:#D9DDEB;
    --tint:#E3E9F3;
    --danger:#8A3B42; --danger-soft:#F6EBEC;
    --good:#2F6F4E; --good-soft:#EAF5EE;
    --font-display:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:"Fraunces",Georgia,"Times New Roman",serif;
    --page-editorial:#FAF9F5;   /* warm cream, Claude-like */
    --sidebar-bg:#F3F1EA;       /* areas are told apart by tone, not borders */
    --well:#F0EEE6;             /* tonal fill: bubbles, chips, quiet buttons */
    --well-strong:#E7E4DA;      /* hover / active fill */
    --ink-editorial:#1F1E1D;
    --text-soft:#5E5D59;
    --muted-aa:#6B6A64;
    --radius-control:8px;
    --radius-panel:20px;
    --shadow-soft:0 1px 2px rgba(31,30,29,.04), 0 6px 24px rgba(31,30,29,.05);
    --sidebar-w:248px;
    --on-accent:#FFFFFF; --bg-glass:rgba(241,243,249,.85); --row-hover:rgba(241,243,249,.7);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --surface:#262521; --bg:#14161D; --accent:#A9C1E8;
    --accent-deep:#C7D7F1; --accent-mid:#8FA9D6; --blue-2:#86A2CF;
    --blue-3:#6E8CBD; --band:#232836; --ink:#E6E8F0;
    --muted-strong:rgba(230,232,240,.72); --muted:#8C91A3; --line-soft:#262833;
    --line:#2E313C; --line-strong:#3B3F4C; --tint:#283041;
    --danger:#E9A0A8; --danger-soft:#3A2327; --good:#86CFA6;
    --good-soft:#1E3329; --page-editorial:#1A1917; --sidebar-bg:#201F1C;
    --well:#2B2A26; --well-strong:#36342F; --ink-editorial:#EDEBE6;
    --text-soft:#B8B5AD; --muted-aa:#9A978F; --shadow-soft:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.28);
    --on-accent:#101A2E; --bg-glass:rgba(20,22,29,.85); --row-hover:rgba(255,255,255,.04);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;min-height:100vh;background:var(--page-editorial);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-serif);font-weight:500;color:var(--ink-editorial);margin:0;line-height:1.1;letter-spacing:-.02em;}

  /* ── App shell: sidebar + content ── */
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}
  .sidebar{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;
    padding:28px 16px 20px;background:var(--sidebar-bg);
  }
  .brand{padding:4px 12px;font:800 22px/1 var(--font-display);color:var(--ink);letter-spacing:-.02em;text-decoration:none;}
  .nav{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;
    border:none;border-radius:var(--radius-control);background:none;cursor:pointer;text-align:left;
    color:var(--text-soft);font:700 15px/1.25 var(--font-body);text-decoration:none;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item:hover{background:var(--well-strong);color:var(--ink-editorial);}
  .nav-item.active{background:var(--well-strong);color:var(--ink-editorial);}
  .nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .nav-item[aria-disabled="true"]{opacity:.55;cursor:default;pointer-events:none;}
  .nav-label{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-heading{display:block;padding:0 12px 6px;font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-aa);}
  .nav-empty{display:block;padding:6px 12px;font-size:13px;color:var(--muted-aa);}
  .nav-logout{margin-top:auto;}
  .content{min-width:0;}

  /* ── Shared: cards, badges, the course + chat room header ── */
  .card{background:var(--surface);border-radius:var(--radius-panel);box-shadow:var(--shadow-soft);padding:28px;}
  .card-label{display:block;font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-aa);margin-bottom:16px;}
  .badge{
    display:inline-block;flex:none;white-space:nowrap;padding:5px 10px;border-radius:999px;
    background:var(--tint);color:var(--accent);font:700 12px/1 var(--font-body);letter-spacing:.03em;
  }
  .room-id{display:flex;align-items:center;gap:10px;min-width:0;}
  .room-course{color:var(--text-soft);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:var(--on-accent);font:700 16px/1 var(--font-display);background:var(--accent);
  }
  .avatar.c2{background:var(--blue-2);}
  .avatar.c3{background:var(--blue-3);}
  .stack{display:flex;padding-left:10px;flex:none;}
  .stack .avatar{margin-left:-10px;border:2px solid var(--page-editorial);}

  @media (max-width:767px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .sidebar{
      position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:4px;
      padding:10px 12px;padding-top:max(10px, env(safe-area-inset-top));
    }
    .brand{margin-right:auto;padding:4px;font-size:19px;}
    .nav{display:flex;gap:2px;}
    .nav-item{width:auto;padding:10px;}
    .nav-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
    .nav-heading, .nav-empty{display:none;}
    .rooms{display:flex;}
    .nav-logout{margin-top:0;}
  }

  html,body{height:100%;}
  .app{height:100dvh;min-height:0;}
  .content{display:flex;flex-direction:column;height:100dvh;}

  /* ── Chat room: one card, course + group header on top ── */
  .room{
    flex:1;min-height:0;display:flex;flex-direction:column;width:100%;
    overflow:hidden;
  }
  .room-head{flex:none;display:flex;align-items:center;gap:16px;padding:22px 32px 14px;}
  .title{flex:1;min-width:0;}
  .title h1{font-size:26px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title p{margin:0;font-size:13px;color:var(--muted-aa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .room-head .avatar{width:34px;height:34px;font-size:14px;}
  .info-btn{
    width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--radius-control);
    border:none;background:none;color:var(--text-soft);cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .info-btn:hover{background:var(--well);color:var(--ink-editorial);}
  .info-btn[aria-expanded="true"]{background:var(--well-strong);color:var(--ink-editorial);}
  .info-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .info-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .room-body{flex:1;min-height:0;display:flex;position:relative;}
  .room-main{flex:1;min-width:0;display:flex;flex-direction:column;}

  /* ── Room info panel (opened from the header button) ── */
  .info-panel{
    width:300px;flex:none;overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-soft);
    margin:0 20px 20px 0;padding:20px 22px 24px;animation:panel-in .18s ease-out;
  }
  .info-panel.wide{width:360px;}
  @keyframes panel-in{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .info-panel{animation:none;} }
  .info-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .info-head h2{font-size:22px;}
  .info-close{
    width:32px;height:32px;display:grid;place-items:center;border:none;border-radius:var(--radius-control);
    background:none;color:var(--muted-aa);cursor:pointer;
  }
  .info-close:hover{background:var(--well);color:var(--ink-editorial);}
  .info-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .info-close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  .info-section{padding:0 0 24px;}
  .info-section .card-label{margin-bottom:10px;}
  .info-course{margin:8px 0 0;font-weight:700;color:var(--ink-editorial);line-height:1.4;}
  .info-members{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
  .info-members li{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);min-width:0;}
  .info-members .avatar{width:32px;height:32px;font-size:13px;}
  .info-members .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .you{flex:none;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--accent);font:700 11px/1.4 var(--font-body);}

  /* ── Meeting polls: pinned bar above the messages + the polls panel ── */
  .meet-bar{
    flex:none;display:flex;align-items:center;gap:10px;width:calc(100% - 48px);max-width:772px;margin:4px auto 0;
    padding:10px 14px;border:none;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-soft);
    color:var(--ink-editorial);font:600 14px/1.35 var(--font-body);text-align:left;cursor:pointer;
  }
  .meet-bar:hover{background:var(--well);}
  .meet-bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .meet-bar svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .meet-bar .meet-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meet-bar .meet-meta{flex:none;color:var(--muted-aa);font-size:13px;}

  .poll{padding:16px 0;border-top:1px solid var(--line-soft);}
  .poll:first-of-type{border-top:none;padding-top:0;}
  .poll-title{margin:0;font:700 16px/1.3 var(--font-body);color:var(--ink-editorial);overflow-wrap:anywhere;}
  .poll-meta{margin:2px 0 12px;font-size:12px;color:var(--muted-aa);}
  .poll-options{list-style:none;margin:0;padding:0;display:grid;gap:6px;}
  .opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-control);background:var(--well);}
  .opt.top{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .opt.final{background:var(--good-soft);box-shadow:inset 0 0 0 1.5px var(--good);}
  .opt.dim{opacity:.5;}
  .opt input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer;}
  .opt-main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .opt-when{font-weight:700;font-size:14px;color:var(--ink-editorial);cursor:pointer;}
  .opt-who{font-size:12px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .opt-count{flex:none;font:800 14px/1 var(--font-body);color:var(--accent);}
  .opt-final{flex:none;font:700 12px/1 var(--font-body);color:var(--good);}
  .link-btn{
    flex:none;padding:4px 8px;border:none;border-radius:6px;background:none;cursor:pointer;
    color:var(--accent);font:700 12px/1.2 var(--font-body);
  }
  .link-btn:hover{background:var(--well-strong);}
  .link-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .link-btn.danger{color:var(--danger);}
  .poll-actions{display:flex;justify-content:flex-end;gap:4px;margin-top:8px;}
  .poll-empty{margin:0 0 16px;font-size:14px;color:var(--text-soft);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;
    border:none;border-radius:var(--radius-control);cursor:pointer;font:700 14px/1 var(--font-body);
    background:var(--accent);color:var(--on-accent);transition:background .15s, opacity .15s;
  }
  .btn:hover{background:var(--accent-deep);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn.quiet{background:var(--well);color:var(--ink-editorial);}
  .btn.quiet:hover{background:var(--well-strong);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .poll-form{display:grid;gap:10px;padding:16px;border-radius:12px;background:var(--well);}
  .poll-form label{font:700 12px/1 var(--font-body);color:var(--text-soft);}
  .poll-form input{
    width:100%;min-height:40px;padding:8px 10px;border:none;border-radius:var(--radius-control);
    background:var(--surface);color:var(--ink-editorial);font:400 14px/1.3 var(--font-body);
  }
  .poll-form input:focus{outline:2px solid var(--accent);outline-offset:0;}
  .time-row{display:flex;gap:6px;align-items:center;}
  .time-row input{flex:1;min-width:0;}
  .poll-times{display:grid;gap:6px;}
  .poll-form-buttons{display:flex;gap:8px;}
  .poll-form-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .poll-error{margin:0;color:var(--danger);font-size:13px;font-weight:600;}
  .poll-error:empty{display:none;}

  /* ── Messages ── */
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;}
  .messages{max-width:820px;margin:0 auto;padding:24px 24px 12px;display:flex;flex-direction:column;min-height:100%;}
  .status{margin:auto;padding:48px 16px;text-align:center;color:var(--muted-aa);}
  .status h2{font-size:26px;margin-bottom:6px;}

  .day{
    align-self:center;margin:16px 0 12px;padding:4px 12px;border-radius:999px;
    color:var(--muted-aa);font:700 12px/1.4 var(--font-body);letter-spacing:.02em;
  }
  .row{display:flex;gap:10px;align-items:flex-end;margin-top:2px;}
  .row.first{margin-top:12px;}
  .row .avatar{width:32px;height:32px;font-size:13px;visibility:hidden;}
  .row.last .avatar{visibility:visible;}
  .row.me{flex-direction:row-reverse;}
  .row.me .avatar{display:none;}
  .body{display:flex;flex-direction:column;align-items:flex-start;max-width:min(560px,78%);}
  .row.me .body{align-items:flex-end;}
  .sender{font:700 13px/1.2 var(--font-body);color:var(--text-soft);margin:0 0 4px 12px;}
  .bubble{
    padding:10px 14px;border-radius:16px;background:var(--well);
    white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-editorial);
  }
  .row.me .bubble{background:var(--accent);color:var(--on-accent);}
  .row:not(.me):not(.last) .bubble{border-bottom-left-radius:6px;}
  .row:not(.me):not(.first) .bubble{border-top-left-radius:6px;}
  .row.me:not(.last) .bubble{border-bottom-right-radius:6px;}
  .row.me:not(.first) .bubble{border-top-right-radius:6px;}
  .time{font-size:11px;color:var(--muted-aa);margin:4px 8px 0;}

  /* ── Attachments in messages ── */
  .body > * + .bubble{margin-top:4px;}
  a.media{display:block;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);}
  a.media img{display:block;max-width:100%;max-height:320px;}
  a.media:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  video.media{display:block;width:320px;max-width:100%;max-height:360px;border-radius:14px;background:#000;}
  .file{
    display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:100%;
    border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;
  }
  .row.me .file{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .file:hover .file-name{text-decoration:underline;}
  .file:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .file-icon{width:36px;height:36px;flex:none;border-radius:10px;background:var(--tint);color:var(--accent);display:grid;place-items:center;}
  .row.me .file-icon{background:color-mix(in srgb, var(--on-accent) 14%, transparent);color:var(--on-accent);}
  .file-icon svg,.pending-thumb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .file-info{display:flex;flex-direction:column;min-width:0;}
  .file-name{font-weight:700;font-size:14px;overflow-wrap:anywhere;}
  .file-size{font-size:12px;opacity:.72;}

  /* ── Composer ── */
  .composer{flex:none;}
  .composer form{max-width:820px;margin:0 auto;padding:8px 24px 24px;display:flex;gap:10px;align-items:flex-end;}
  .composer textarea{
    flex:1;resize:none;max-height:160px;min-height:44px;padding:11px 14px;border-radius:var(--radius-control);
    border:none;background:var(--surface);color:var(--ink-editorial);box-shadow:var(--shadow-soft);
    font:400 15px/1.45 var(--font-body);
  }
  .composer textarea::placeholder{color:var(--muted-aa);}
  .composer textarea:focus{outline:none;box-shadow:0 1px 2px rgba(31,30,29,.06), 0 8px 28px rgba(31,30,29,.11);}
  .send{
    width:44px;height:44px;flex:none;border:none;border-radius:var(--radius-control);cursor:pointer;
    background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:background .15s,opacity .15s;
  }
  .send:hover{background:var(--accent-deep);}
  .send:disabled{opacity:.35;cursor:default;}
  .send:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .error{max-width:820px;margin:0 auto;padding:10px 24px 0;color:var(--danger);font-size:13px;font-weight:600;}
  .error:empty{display:none;}

  .attach{
    width:44px;height:44px;flex:none;border:none;border-radius:var(--radius-control);cursor:pointer;
    background:transparent;color:var(--text-soft);display:grid;place-items:center;transition:background .15s,opacity .15s;
  }
  .attach:hover{background:var(--well);color:var(--ink-editorial);}
  .attach:disabled{opacity:.4;cursor:default;background:transparent;}
  .attach:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .attach svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ── File picked but not sent yet ── */
  .pending{max-width:820px;margin:0 auto;padding:12px 24px 0;}
  .pending[hidden]{display:none;}
  .pending-card{
    display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;
    border-radius:12px;background:var(--surface);box-shadow:var(--shadow-soft);
  }
  .pending-thumb{width:44px;height:44px;flex:none;border-radius:10px;overflow:hidden;background:var(--tint);color:var(--accent);display:grid;place-items:center;}
  .pending-thumb img{width:100%;height:100%;object-fit:cover;}
  .pending-info{flex:1;min-width:0;}
  .pending-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pending-meta{font-size:12px;color:var(--muted-aa);}
  .pending-remove{
    width:36px;height:36px;flex:none;border:none;border-radius:50%;cursor:pointer;
    background:transparent;color:var(--muted-strong);display:grid;place-items:center;
  }
  .pending-remove:hover{background:var(--well);}
  .pending-remove:disabled{opacity:.4;cursor:default;background:transparent;}
  .pending-remove:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .pending-remove svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}

  @media (max-width:767px){
    .app{height:100dvh;}
    .content{height:auto;min-height:0;padding:0;}
    .room-head{padding:14px 16px 10px;}
    .title h1{font-size:22px;}
    .room-head .stack{display:none;}
    .info-panel{position:absolute;inset:0;width:auto;margin:0;border-radius:0;box-shadow:none;z-index:2;}
    .info-panel.wide{width:auto;}
    .messages{padding:16px 16px 8px;}
    .meet-bar{width:calc(100% - 32px);}
    .composer form{padding:8px 16px;padding-bottom:max(12px, env(safe-area-inset-bottom));gap:6px;}
    .pending{padding:10px 16px 0;}
    .error{padding:8px 16px 0;}
    .body{max-width:85%;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/home">StudyMatch</a>
    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Home</span></a>
      <a class="nav-item" href="/account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span class="nav-label">Account</span></a>
    </nav>
    <div class="rooms">
      <span class="nav-heading">Chat rooms</span>
      <nav class="nav" aria-label="Chat rooms">
        <a class="nav-item active" aria-current="page" id="nav-chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12z"/></svg><span class="nav-label" id="nav-chat-name"></span></a>
        <span class="nav-empty" id="nav-chat-empty">Loading…</span>
      </nav>
    </div>
    <button class="nav-item nav-logout" id="logout-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M14 16l4-4-4-4"/><path d="M18 12H9"/></svg><span class="nav-label">Log out</span></button>
  </aside>

  <main class="content">
    <section class="room" aria-labelledby="group-name">
      <header class="room-head">
        <div class="title">
          <h1 id="group-name">Chat room</h1>
          <p id="group-sub">Loading…</p>
        </div>
        <div class="stack" id="member-stack" aria-hidden="true"></div>
        <button class="info-btn" id="poll-btn" type="button" aria-label="Meeting time polls" aria-expanded="false" aria-controls="poll-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>
        </button>
        <button class="info-btn" id="info-btn" type="button" aria-label="Room info" aria-expanded="false" aria-controls="info-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></svg>
        </button>
      </header>

      <div class="room-body">
      <div class="room-main">

      <button class="meet-bar" id="meet-bar" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span class="meet-text" id="meet-text"></span>
        <span class="meet-meta" id="meet-meta"></span>
      </button>

      <div class="scroll" id="scroll">
        <div class="messages" id="messages" aria-live="polite">
          <div class="status"><p>Loading messages…</p></div>
        </div>
      </div>

      <div class="composer">
        <div class="error" id="error" role="alert"></div>
        <div class="pending" id="pending" hidden>
          <div class="pending-card">
            <div class="pending-thumb" id="pending-thumb"></div>
            <div class="pending-info">
              <div class="pending-name" id="pending-name"></div>
              <div class="pending-meta" id="pending-meta"></div>
            </div>
            <button class="pending-remove" id="pending-remove" type="button" aria-label="Remove attachment">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <form id="composer">
          <input type="file" id="file" hidden>
          <button class="attach" id="attach" type="button" aria-label="Attach a photo, video or file" disabled>
            <svg viewBox="0 0 24 24"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
          </button>
          <textarea id="input" rows="1" maxlength="1000" placeholder="Message your group" aria-label="Message" disabled></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg>
          </button>
        </form>
      </div>
      </div>

      <aside class="info-panel" id="info-panel" aria-label="Room info" hidden>
        <div class="info-head">
          <h2>Room info</h2>
          <button class="info-close" id="info-close" type="button" aria-label="Close room info">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <section class="info-section">
          <span class="card-label">Course</span>
          <span class="badge" id="info-course-code"></span>
          <p class="info-course" id="info-course-title"></p>
        </section>
        <section class="info-section">
          <span class="card-label" id="info-count">Members</span>
          <ul class="info-members" id="info-members"></ul>
        </section>
      </aside>

      <aside class="info-panel wide" id="poll-panel" aria-label="Meeting time polls" hidden>
        <div class="info-head">
          <h2>Meeting time</h2>
          <button class="info-close" id="poll-close" type="button" aria-label="Close meeting time polls">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <section class="info-section">
          <button class="btn" id="poll-new" type="button">New poll</button>
          <form class="poll-form" id="poll-form" hidden>
            <label for="poll-title">Title</label>
            <input id="poll-title" maxlength="100" placeholder="Meeting time">
            <label>Times to vote on</label>
            <div class="poll-times" id="poll-times"></div>
            <p class="poll-error" id="poll-form-error" role="alert"></p>
            <div class="poll-form-actions">
              <button class="btn quiet" id="poll-add-time" type="button">+ Add time</button>
              <span class="poll-form-buttons">
                <button class="btn quiet" id="poll-cancel" type="button">Cancel</button>
                <button class="btn" id="poll-create" type="submit">Create</button>
              </span>
            </div>
          </form>
        </section>
        <section class="info-section">
          <p class="poll-error" id="poll-error" role="alert"></p>
          <div id="poll-list"><p class="poll-empty">Loading…</p></div>
        </section>
      </aside>
      </div>
    </section>
  </main>
</div>

<script>
const POLL_MS = 3000;
const GROUP_ID = new URLSearchParams(location.search).get('group');
const BASE = '/api/groups/' + encodeURIComponent(GROUP_ID || '');

const AVATAR_COLORS = ['', 'c2', 'c3'];
const colorFor = {};   // student id -> avatar color class, stable for the page's lifetime
function color(id){ return colorFor[id] ??= AVATAR_COLORS[Object.keys(colorFor).length % 3]; }
function initial(name){ return (name || '?').trim().charAt(0).toUpperCase(); }

const scrollEl = document.getElementById('scroll');
const listEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const errorEl = document.getElementById('error');
const fileInput = document.getElementById('file');
const attachBtn = document.getElementById('attach');
const pendingEl = document.getElementById('pending');
const pendingThumb = document.getElementById('pending-thumb');
const pendingName = document.getElementById('pending-name');
const pendingMeta = document.getElementById('pending-meta');
const pendingRemove = document.getElementById('pending-remove');

// Static icon markup only - never user input.
const FILE_SVG = '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const VIDEO_SVG = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>';
const PREVIEW_TYPES = /^image\/(png|jpeg|gif|webp)$/;

let maxBytes = 10 * 1024 * 1024;   // replaced by the server's limit once the group loads
let pendingFile = null;
let previewUrl = null;
let pinned = true;       // user is at the bottom, so media that finishes loading keeps them there

let lastId = 0;
let lastMsg = null;      // previous rendered message, for grouping consecutive bubbles
let lastRow = null;
let polling = false;
let repoll = false;      // a poll was requested while one was in flight
let timer = null;
let sending = false;     // guards against a double Enter re-sending the same text
const members = {};      // student id -> { name, is_me }, filled by loadGroup()

const CONN_ERROR = "Couldn't reach the server. Retrying…";
// Only the poller's own error is cleared by a successful poll - a send error
// ("Messages are limited to ...") stays until the next send attempt.
function setError(msg){ errorEl.textContent = msg; }
function clearConnError(){ if (errorEl.textContent === CONN_ERROR) setError(''); }

// 401 -> log in again; 403/404 -> not your group, back home.
function bounce(res){
  if (res.status === 401) { location.href = '/login'; return true; }
  if (res.status === 403 || res.status === 404) { location.href = '/home'; return true; }
  return false;
}

function dayLabel(d){
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
const timeLabel = d => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // textContent, never innerHTML - message text is user input
  return e;
}

function nearBottom(){ return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function toBottom(){ scrollEl.scrollTop = scrollEl.scrollHeight; }
scrollEl.addEventListener('scroll', () => { pinned = nearBottom(); });
function keepPinned(){ if (pinned) toBottom(); }

function formatSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function attachmentEl(a){
  const url = `${BASE}/attachments/${encodeURIComponent(a.id)}`;
  if (a.kind === 'image') {
    const link = el('a', 'media');
    link.href = url; link.target = '_blank'; link.rel = 'noopener';
    const img = el('img');
    img.src = url; img.alt = a.filename; img.loading = 'lazy';
    img.addEventListener('load', keepPinned);
    link.appendChild(img);
    return link;
  }
  if (a.kind === 'video') {
    const video = el('video', 'media');
    video.src = url; video.controls = true; video.preload = 'metadata'; video.playsInline = true;
    video.addEventListener('loadedmetadata', keepPinned);
    return video;
  }
  const link = el('a', 'file');
  link.href = url; link.download = a.filename;
  const icon = el('span', 'file-icon');
  icon.innerHTML = FILE_SVG;
  const info = el('span', 'file-info');
  info.append(el('span', 'file-name', a.filename), el('span', 'file-size', formatSize(a.size_bytes)));
  link.append(icon, info);
  return link;
}

function render(messages){
  if (!messages.length) return;
  if (lastId === 0) listEl.innerHTML = '';
  for (const m of messages) {
    const at = new Date(m.created_at);
    const prevAt = lastMsg && new Date(lastMsg.created_at);
    const newDay = !prevAt || prevAt.toDateString() !== at.toDateString();
    // Same sender within 5 minutes on the same day -> one visual cluster.
    const continues = lastMsg && !newDay && lastMsg.sender_id === m.sender_id
                      && at - prevAt < 5 * 60 * 1000;

    if (newDay) listEl.appendChild(el('div', 'day', dayLabel(at)));
    if (continues) {
      lastRow.classList.remove('last');
      lastRow.querySelector('.time')?.remove();
    }

    const row = el('div', 'row last' + (m.is_me ? ' me' : '') + (continues ? '' : ' first'));
    row.appendChild(el('div', 'avatar ' + color(m.sender_id), initial(m.name)));
    const body = el('div', 'body');
    if (!continues && !m.is_me) body.appendChild(el('div', 'sender', m.name));
    if (m.attachment) body.appendChild(attachmentEl(m.attachment));
    if (m.text) body.appendChild(el('div', 'bubble', m.text));
    body.appendChild(el('div', 'time', timeLabel(at)));
    row.appendChild(body);
    listEl.appendChild(row);

    lastMsg = m; lastRow = row; lastId = m.message_id;
  }
}

async function poll(){
  if (polling) { repoll = true; return; }
  polling = true;
  try {
    const res = await fetch(`${BASE}/messages?after=${lastId}`);
    if (bounce(res)) return;
    if (!res.ok) throw new Error();
    const { messages } = await res.json();
    const first = lastId === 0;
    const stick = first || nearBottom();
    if (first && !messages.length) {
      listEl.innerHTML = '<div class="status"><h2>No messages yet</h2><p>Say hi and pick a time for your first session.</p></div>';
    }
    render(messages);
    if (stick) toBottom();
    clearConnError();
  } catch {
    setError(CONN_ERROR);
  } finally {
    polling = false;
    if (repoll) { repoll = false; poll(); }
  }
}

// Poll only while the tab is visible; catch up immediately on return.
function schedule(){
  clearInterval(timer);
  timer = document.hidden ? null : setInterval(() => { poll(); loadPolls(); }, POLL_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); loadPolls(); } schedule(); });

async function loadGroup(){
  const res = await fetch(BASE);
  if (bounce(res)) return false;
  if (!res.ok) { document.getElementById('group-sub').textContent = 'Something went wrong loading this group.'; return false; }
  const g = await res.json();
  g.members.forEach(m => { members[m.student_id] = m; });
  if (g.attachment_max_bytes) maxBytes = g.attachment_max_bytes;
  document.getElementById('group-name').textContent = g.group_name;
  document.title = `StudyMatch · ${g.group_name}`;
  setChatNav(GROUP_ID, g.group_name);
  const names = g.members.map(m => m.is_me ? 'You' : m.name.split(' ')[0]);
  document.getElementById('group-sub').textContent = (g.is_admin ? 'Admin group · ' : '') + names.join(', ');
  const stack = document.getElementById('member-stack');
  g.members.filter(m => !m.is_me).forEach(m => {
    stack.appendChild(el('div', 'avatar ' + color(m.student_id), initial(m.name)));
  });

  document.getElementById('info-course-code').textContent = g.course_code;
  document.getElementById('info-course-title').textContent = g.course_title;
  document.getElementById('info-count').textContent = `Members · ${g.members.length}`;
  const list = document.getElementById('info-members');
  g.members.forEach(m => {
    const li = el('li');
    li.appendChild(el('div', 'avatar ' + color(m.student_id), initial(m.name)));
    li.appendChild(el('span', 'name', m.name));
    if (m.is_me) li.appendChild(el('span', 'you', 'You'));
    list.appendChild(li);
  });
  return true;
}

// ── Side panels (room info, meeting polls) - at most one open at a time ──
const PANELS = {
  info: { btn: document.getElementById('info-btn'), panel: document.getElementById('info-panel'), close: document.getElementById('info-close') },
  poll: { btn: document.getElementById('poll-btn'), panel: document.getElementById('poll-panel'), close: document.getElementById('poll-close') },
};
function setPanel(name, open){
  for (const [key, p] of Object.entries(PANELS)) {
    const show = open && key === name;
    p.panel.hidden = !show;
    p.btn.setAttribute('aria-expanded', String(show));
  }
  if (open) PANELS[name].close.focus();
  else PANELS[name].btn.focus();
}
for (const [name, p] of Object.entries(PANELS)) {
  p.btn.addEventListener('click', () => setPanel(name, p.panel.hidden));
  p.close.addEventListener('click', () => setPanel(name, false));
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const open = Object.keys(PANELS).find(k => !PANELS[k].panel.hidden);
  if (open) setPanel(open, false);
});

// ── Meeting-time polls ──
const pollListEl = document.getElementById('poll-list');
const pollErrorEl = document.getElementById('poll-error');
const pollForm = document.getElementById('poll-form');
const pollTimes = document.getElementById('poll-times');
const pollFormError = document.getElementById('poll-form-error');
const meetBar = document.getElementById('meet-bar');
let polls = [];
let pollsJson = '';
let loadingPolls = false;
let reloadPolls = false;   // a forced reload was asked for while one was in flight

const whenLabel = iso => new Date(iso).toLocaleString(undefined,
  { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function voterName(id){
  const m = members[id];
  return !m ? 'Former member' : m.is_me ? 'You' : m.name.split(' ')[0];
}

async function loadPolls(force){
  if (loadingPolls) { if (force) reloadPolls = true; return; }
  loadingPolls = true;
  try {
    const res = await fetch(`${BASE}/polls`);
    if (bounce(res)) return;
    if (!res.ok) throw new Error();
    const text = await res.text();
    if (force || text !== pollsJson) {   // skip re-rendering (and stealing focus) when nothing changed
      pollsJson = text;
      polls = JSON.parse(text).polls;
      renderPolls();
    }
  } catch {
    // The chat poller already reports connection trouble; keep the last good render.
  } finally {
    loadingPolls = false;
    if (reloadPolls) { reloadPolls = false; loadPolls(true); }
  }
}

function renderMeetBar(){
  const now = new Date().toISOString();
  const confirmed = polls.map(p => ({ p, o: p.options.find(o => o.option_id === p.final_option_id) }))
                         .filter(x => x.o && x.o.starts_at > now)
                         .sort((a, b) => a.o.starts_at.localeCompare(b.o.starts_at))[0];
  const open = polls.find(p => p.final_option_id == null);
  const memberCount = Object.keys(members).length;
  if (confirmed) {
    document.getElementById('meet-text').textContent = `${confirmed.p.title}: ${whenLabel(confirmed.o.starts_at)}`;
    document.getElementById('meet-meta').textContent = 'Confirmed';
  } else if (open) {
    document.getElementById('meet-text').textContent = `Vote on a time: ${open.title}`;
    document.getElementById('meet-meta').textContent = `${open.voter_count} of ${memberCount} voted`;
  }
  meetBar.hidden = !confirmed && !open;
}

function renderPolls(){
  renderMeetBar();
  const focusKey = document.activeElement?.dataset?.key;
  pollListEl.innerHTML = '';
  if (!polls.length) {
    pollListEl.appendChild(el('p', 'poll-empty', 'No polls yet. Start one to pick a time everyone can make.'));
    return;
  }
  for (const p of polls) {
    const decided = p.final_option_id != null;
    const sec = el('div', 'poll');
    sec.appendChild(el('h3', 'poll-title', p.title));
    sec.appendChild(el('p', 'poll-meta',
      `By ${p.is_mine ? 'you' : p.created_by_name} · ${p.voter_count} voted` + (decided ? ' · Decided' : '')));
    const best = Math.max(0, ...p.options.map(o => o.voters.length));
    const list = el('ul', 'poll-options');
    for (const o of p.options) {
      const isFinal = o.option_id === p.final_option_id;
      const li = el('li', 'opt' + (isFinal ? ' final' : decided ? ' dim' : best && o.voters.length === best ? ' top' : ''));
      const boxId = `opt-${o.option_id}`;
      if (!decided) {
        const box = el('input');
        box.type = 'checkbox'; box.id = boxId; box.checked = o.voted_by_me;
        box.dataset.key = boxId;
        box.addEventListener('change', () => vote(p, list));
        box.dataset.optionId = o.option_id;
        li.appendChild(box);
      }
      const main = el('div', 'opt-main');
      const when = el(decided ? 'span' : 'label', 'opt-when', whenLabel(o.starts_at));
      if (!decided) when.htmlFor = boxId;
      main.appendChild(when);
      main.appendChild(el('span', 'opt-who', o.voters.length ? o.voters.map(voterName).join(', ') : 'No votes yet'));
      li.appendChild(main);
      if (isFinal) li.appendChild(el('span', 'opt-final', 'Confirmed'));
      else if (p.is_mine) {
        const pick = el('button', 'link-btn', decided ? 'Change to this' : 'Confirm');
        pick.type = 'button'; pick.dataset.key = `pick-${o.option_id}`;
        pick.addEventListener('click', () => pollAction(`${BASE}/polls/${p.poll_id}/finalize`, 'POST', { option_id: o.option_id }));
        li.appendChild(pick);
      }
      li.appendChild(el('span', 'opt-count', String(o.voters.length)));
      list.appendChild(li);
    }
    sec.appendChild(list);
    if (p.is_mine) {
      const actions = el('div', 'poll-actions');
      const del = el('button', 'link-btn danger', 'Delete poll');
      del.type = 'button';
      del.addEventListener('click', () => {
        if (confirm(`Delete "${p.title}"? Everyone's votes on it are removed too.`)) {
          pollAction(`${BASE}/polls/${p.poll_id}`, 'DELETE');
        }
      });
      actions.appendChild(del);
      sec.appendChild(actions);
    }
    pollListEl.appendChild(sec);
  }
  if (focusKey) pollListEl.querySelector(`[data-key="${focusKey}"]`)?.focus();
}

async function pollAction(url, method, body){
  pollErrorEl.textContent = '';
  try {
    const res = await fetch(url, {
      method, headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    if (bounce(res)) return false;
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      pollErrorEl.textContent = typeof err.detail === 'string' ? err.detail : "Couldn't save that. Try again.";
      return false;
    }
    return true;
  } catch {
    pollErrorEl.textContent = "Couldn't reach the server. Try again.";
    return false;
  } finally {
    await loadPolls(true);
  }
}

function vote(p, list){
  const option_ids = [...list.querySelectorAll('input[type=checkbox]:checked')].map(b => Number(b.dataset.optionId));
  pollAction(`${BASE}/polls/${p.poll_id}/votes`, 'POST', { option_ids });
}

meetBar.addEventListener('click', () => setPanel('poll', true));

// New-poll form: a list of datetime-local inputs, at least two.
const MAX_TIMES = 10;
function localNow(){
  const d = new Date(); d.setSeconds(0, 0);
  return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function addTimeRow(){
  if (pollTimes.children.length >= MAX_TIMES) return;
  const row = el('div', 'time-row');
  const input = el('input');
  input.type = 'datetime-local'; input.min = localNow(); input.required = true;
  input.setAttribute('aria-label', `Time ${pollTimes.children.length + 1}`);
  const remove = el('button', 'link-btn danger', 'Remove');
  remove.type = 'button';
  remove.addEventListener('click', () => { row.remove(); syncTimeRows(); });
  row.append(input, remove);
  pollTimes.appendChild(row);
  syncTimeRows();
  return input;
}
function syncTimeRows(){
  const rows = [...pollTimes.children];
  rows.forEach(r => { r.querySelector('button').hidden = rows.length <= 2; });
  document.getElementById('poll-add-time').disabled = rows.length >= MAX_TIMES;
}
function openPollForm(open){
  pollForm.hidden = !open;
  document.getElementById('poll-new').hidden = open;
  pollFormError.textContent = '';
  if (open) {
    document.getElementById('poll-title').value = '';
    pollTimes.innerHTML = '';
    addTimeRow(); addTimeRow();
    document.getElementById('poll-title').focus();
  } else {
    document.getElementById('poll-new').focus();
  }
}
document.getElementById('poll-new').addEventListener('click', () => openPollForm(true));
document.getElementById('poll-cancel').addEventListener('click', () => openPollForm(false));
document.getElementById('poll-add-time').addEventListener('click', () => addTimeRow()?.focus());

pollForm.addEventListener('submit', async e => {
  e.preventDefault();
  // datetime-local has no zone: new Date() reads it as the viewer's local time, toISOString() sends UTC.
  const options = [...pollTimes.querySelectorAll('input')].map(i => i.value).filter(Boolean)
                    .map(v => new Date(v).toISOString());
  if (new Set(options).size < 2) { pollFormError.textContent = 'Add at least two different times.'; return; }
  const createBtn = document.getElementById('poll-create');
  createBtn.disabled = true;
  try {
    const res = await fetch(`${BASE}/polls`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: document.getElementById('poll-title').value, options }),
    });
    if (bounce(res)) return;
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      pollFormError.textContent = typeof err.detail === 'string' ? err.detail : "Couldn't create the poll. Try again.";
      return;
    }
    openPollForm(false);
    await loadPolls(true);
  } catch {
    pollFormError.textContent = "Couldn't reach the server. Try again.";
  } finally {
    createBtn.disabled = false;
  }
});

// ── Composer ──
function autosize(){ input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
function updateSend(){
  sendBtn.disabled = sending || (!input.value.trim() && !pendingFile);
  attachBtn.disabled = sending || input.disabled;
  pendingRemove.disabled = sending;
}

function clearPending(){
  pendingFile = null;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  pendingEl.hidden = true;
  fileInput.value = '';
  updateSend();
}

function setPending(file){
  clearPending();
  if (!file) return;
  if (!file.size) { setError(`${file.name} is empty.`); return; }
  if (file.size > maxBytes) {
    setError(`Files are limited to ${formatSize(maxBytes)}, and ${file.name} is ${formatSize(file.size)}.`);
    return;
  }
  setError('');
  pendingFile = file;
  pendingThumb.textContent = '';
  if (PREVIEW_TYPES.test(file.type)) {
    previewUrl = URL.createObjectURL(file);
    const img = el('img');
    img.src = previewUrl; img.alt = '';
    pendingThumb.appendChild(img);
  } else {
    pendingThumb.innerHTML = file.type.startsWith('video/') ? VIDEO_SVG : FILE_SVG;
  }
  pendingName.textContent = file.name;
  pendingMeta.textContent = formatSize(file.size);
  pendingEl.hidden = false;
  updateSend();
  input.focus();
}

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setPending(fileInput.files[0]));
pendingRemove.addEventListener('click', () => { clearPending(); input.focus(); });

// XMLHttpRequest rather than fetch: fetch can't report upload progress.
function uploadFile(file, text){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${BASE}/attachments`);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) pendingMeta.textContent = `Uploading… ${Math.round(e.loaded / e.total * 100)}%`;
    };
    xhr.onload = () => {
      let body = {};
      try { body = JSON.parse(xhr.responseText); } catch {}
      resolve({ status: xhr.status, ok: xhr.status >= 200 && xhr.status < 300, body });
    };
    xhr.onerror = () => reject(new Error('network'));
    const form = new FormData();
    form.append('file', file);
    if (text) form.append('text', text);
    xhr.send(form);
  });
}
input.addEventListener('input', () => { autosize(); updateSend(); });
// Enter sends, Shift+Enter is a newline. Skip while an IME is composing (e.g. Korean
// input): isComposing covers Chrome/Firefox; Safari instead reports the Enter that
// commits the composition as keyCode 229 with isComposing already false.
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); document.getElementById('composer').requestSubmit(); }
});

document.getElementById('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  const file = pendingFile;
  if ((!text && !file) || sending) return;
  sending = true;
  updateSend();
  try {
    let res, err = {};
    if (file) {
      res = await uploadFile(file, text);
      err = res.body;
    } else {
      res = await fetch(`${BASE}/messages`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
      });
      if (!res.ok) err = await res.json().catch(() => ({}));
    }
    if (bounce(res)) return;
    if (!res.ok) {
      setError(typeof err.detail === 'string' ? err.detail : "Couldn't send. Try again.");
      if (file) pendingMeta.textContent = formatSize(file.size);
      return;
    }
    setError('');
    input.value = ''; autosize();
    if (file) clearPending();
    await poll();
    toBottom();
  } catch {
    setError("Couldn't send. Try again.");
    if (file) pendingMeta.textContent = formatSize(file.size);
  } finally {
    sending = false;
    updateSend();
  }
  input.focus();
});

(async () => {
  if (!GROUP_ID) { location.href = '/home'; return; }
  if (!await loadGroup()) return;
  await Promise.all([poll(), loadPolls()]);
  input.disabled = false;
  updateSend();
  input.focus();
  schedule();
})();

// ── Sidebar ──
function setChatNav(groupId, groupName){
  const link = document.getElementById('nav-chat');
  const empty = document.getElementById('nav-chat-empty');
  if (!groupId) { empty.textContent = 'None yet'; return; }
  link.href = '/chat?group=' + encodeURIComponent(groupId);
  link.title = groupName;
  document.getElementById('nav-chat-name').textContent = groupName;
  link.hidden = false;
  empty.hidden = true;
}
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
});
