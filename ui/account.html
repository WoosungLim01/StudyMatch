<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StudyMatch · Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* StudyMatch tokens — see Design.md (same editorial tone as the login page) */
  :root{
    --bg:#F1F3F9; --surface:#FFFFFF;
    --accent:#14213D; --accent-deep:#0A1B33; --accent-mid:#1B2A4A;
    --blue-2:#2C4770; --blue-3:#5C7EA6; --band:#E3E9F3;
    --ink:#1F2547; --muted-strong:rgba(31,37,71,.72); --muted:#8A90A8;
    --line-soft:#EEF0F6; --line:#E4E7F2; --line-strong:#D9DDEB;
    --tint:#E3E9F3;
    --danger:#8A3B42; --danger-soft:#F6EBEC;
    --good:#2F6F4E; --good-soft:#EAF5EE;
    --font-display:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:"Fraunces",Georgia,"Times New Roman",serif;
    --page-editorial:#FAF9F5;   /* warm cream, Claude-like */
    --sidebar-bg:#F3F1EA;       /* areas are told apart by tone, not borders */
    --well:#F0EEE6;             /* tonal fill: bubbles, chips, quiet buttons */
    --well-strong:#E7E4DA;      /* hover / active fill */
    --ink-editorial:#1F1E1D;
    --text-soft:#5E5D59;
    --muted-aa:#6B6A64;
    --radius-control:8px;
    --radius-panel:20px;
    --shadow-soft:0 1px 2px rgba(31,30,29,.04), 0 6px 24px rgba(31,30,29,.05);
    --sidebar-w:248px;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;min-height:100vh;background:var(--page-editorial);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-serif);font-weight:500;color:var(--ink-editorial);margin:0;line-height:1.1;letter-spacing:-.02em;}

  /* ── App shell: sidebar + content ── */
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}
  .sidebar{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;
    padding:28px 16px 20px;background:var(--sidebar-bg);
  }
  .brand{padding:4px 12px;font:800 22px/1 var(--font-display);color:var(--ink);letter-spacing:-.02em;text-decoration:none;}
  .nav{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;
    border:none;border-radius:var(--radius-control);background:none;cursor:pointer;text-align:left;
    color:var(--text-soft);font:700 15px/1.25 var(--font-body);text-decoration:none;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .nav-item:hover{background:var(--well-strong);color:var(--ink-editorial);}
  .nav-item.active{background:var(--well-strong);color:var(--ink-editorial);}
  .nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .nav-item[aria-disabled="true"]{opacity:.55;cursor:default;pointer-events:none;}
  .nav-label{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-heading{display:block;padding:0 12px 6px;font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-aa);}
  .nav-empty{display:block;padding:6px 12px;font-size:13px;color:var(--muted-aa);}
  .nav-logout{margin-top:auto;}
  .content{min-width:0;}

  /* ── Shared: cards, badges, the course + chat room header ── */
  .card{background:var(--surface);border-radius:var(--radius-panel);box-shadow:var(--shadow-soft);padding:28px;}
  .card-label{display:block;font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-aa);margin-bottom:16px;}
  .badge{
    display:inline-block;flex:none;white-space:nowrap;padding:5px 10px;border-radius:999px;
    background:var(--tint);color:var(--accent);font:700 12px/1 var(--font-body);letter-spacing:.03em;
  }
  .room-id{display:flex;align-items:center;gap:10px;min-width:0;}
  .room-course{color:var(--text-soft);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:#fff;font:700 16px/1 var(--font-display);background:var(--accent);
  }
  .avatar.c2{background:var(--blue-2);}
  .avatar.c3{background:var(--blue-3);}
  .stack{display:flex;padding-left:10px;flex:none;}
  .stack .avatar{margin-left:-10px;border:2px solid var(--page-editorial);}

  @media (max-width:767px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .sidebar{
      position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:4px;
      padding:10px 12px;padding-top:max(10px, env(safe-area-inset-top));
    }
    .brand{margin-right:auto;padding:4px;font-size:19px;}
    .nav{display:flex;gap:2px;}
    .nav-item{width:auto;padding:10px;}
    .nav-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
    .nav-heading, .nav-empty{display:none;}
    .rooms{display:flex;}
    .nav-logout{margin-top:0;}
  }

  .page{max-width:680px;margin:0 auto;padding:48px 40px 64px;}
  .hero{margin-bottom:32px;}
  .hero h1{font-size:42px;margin:0 0 6px;}
  .hero p{margin:0;color:var(--text-soft);font-size:17px;}
  .card{margin-bottom:20px;}

  .row{margin-bottom:16px;}
  .row:last-child{margin-bottom:0;}
  label{display:block;font:700 14px/1.4 var(--font-body);color:var(--ink);margin-bottom:6px;}
  input[type=text]{
    width:100%;height:44px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--well-strong);
    background-color:var(--surface);color:var(--ink-editorial);font:400 15px/1 var(--font-body);
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  input:disabled{background-color:var(--well);color:var(--muted-aa);cursor:not-allowed;}

  .email-line{
    height:44px;display:flex;align-items:center;padding:0 14px;border-radius:var(--radius-control);
    background:var(--well);color:var(--text-soft);font-weight:600;font-size:15px;
  }

  .btn{
    height:44px;padding:0 22px;border-radius:var(--radius-control);cursor:pointer;
    background:var(--accent);color:#fff;border:none;
    font:700 15px/1 var(--font-body);transition:background .15s;
  }
  .btn:hover{background:var(--accent-deep);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}

  .btn-ghost{
    height:44px;padding:0 20px;border-radius:var(--radius-control);cursor:pointer;
    background:var(--well);color:var(--ink-editorial);border:none;
    font:700 15px/1 var(--font-body);transition:background .15s, border-color .15s;
  }
  .btn-ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .save-row{display:flex;align-items:center;gap:14px;margin-top:20px;}
  .save-msg{font-size:14px;font-weight:700;display:none;}
  .save-msg.good{color:var(--good);display:inline;}
  .save-msg.bad{color:var(--danger);display:inline;}

  .danger-zone .btn-ghost{background:var(--danger-soft);color:var(--danger);}
  .danger-zone .btn-ghost:hover{background:#EFDDDF;}

  @media (max-width:1023px){ .page{padding:44px 32px 64px;} }
  @media (max-width:767px){
    .page{padding:28px 16px 56px;}
    .hero h1{font-size:34px;}
    .card{padding:22px 18px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/home">StudyMatch</a>
    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Home</span></a>
      <a class="nav-item active" aria-current="page" href="/account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span class="nav-label">Account</span></a>
    </nav>
    <div class="rooms">
      <span class="nav-heading">Chat rooms</span>
      <nav class="nav" aria-label="Chat rooms">
        <a class="nav-item" id="nav-chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.4A8 8 0 1 1 20 12z"/></svg><span class="nav-label" id="nav-chat-name"></span></a>
        <span class="nav-empty" id="nav-chat-empty">Loading…</span>
      </nav>
    </div>
    <button class="nav-item nav-logout" id="logout-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/><path d="M14 16l4-4-4-4"/><path d="M18 12H9"/></svg><span class="nav-label">Log out</span></button>
  </aside>

  <main class="content">
    <div class="page">
      <div class="hero">
        <h1>Your account</h1>
        <p>Update the name your group sees.</p>
      </div>

      <section class="card">
        <span class="card-label">Profile</span>
        <div class="row">
          <label for="f-email">Email</label>
          <div class="email-line" id="f-email">Loading…</div>
        </div>
        <div class="row">
          <label for="f-name">Name</label>
          <input type="text" id="f-name" disabled placeholder="Loading…">
        </div>
        <div class="save-row">
          <button class="btn" id="save-btn" disabled>Save changes</button>
          <span class="save-msg" id="save-msg"></span>
        </div>
      </section>

      <section class="card danger-zone">
        <span class="card-label">Delete account</span>
        <p style="margin:0 0 18px;color:var(--text-soft);">
          Permanently deletes your account and, if you've taken the survey, your group membership and
          survey data. This can't be undone. A confirmation email is sent once it's done.
        </p>
        <button class="btn-ghost" id="delete-btn">Delete my account</button>
      </section>
    </div>
  </main>
</div>

<script>
const API = '';

// Same sanitize-as-you-type rule as the survey's name fields: strip all
// whitespace, force the first letter to caps.
function sanitizeNamePart(v){
  v = v.replace(/\s+/g, '');
  return v ? v.charAt(0).toUpperCase() + v.slice(1) : v;
}

let originalName = '';

async function load(){
  const res = await fetch(API + '/api/account');
  if (res.status === 401) { window.location.href = '/login'; return; }
  if (res.status === 400) { window.location.href = '/survey'; return; }
  if (!res.ok) {
    document.getElementById('f-email').textContent = 'Something went wrong loading your account.';
    return;
  }
  const data = await res.json();
  document.getElementById('f-email').textContent = data.email;
  const nameInput = document.getElementById('f-name');
  nameInput.value = data.name;
  nameInput.disabled = false;
  nameInput.placeholder = '';
  originalName = data.name;
  document.getElementById('save-btn').disabled = false;
}
load();

// Only the sidebar's chat link needs the group; /api/account doesn't carry it.
fetch(API + '/api/home')
  .then(r => r.ok ? r.json() : null)
  .then(d => setChatNav(d && d.status === 'grouped' ? d.group_id : null, d && d.group_name))
  .catch(() => setChatNav(null));

const nameInput = document.getElementById('f-name');
nameInput.addEventListener('input', () => {
  const pos = nameInput.selectionStart;
  const before = nameInput.value.length;
  // Sanitize each space-separated part independently so a full "First Last"
  // name keeps its internal space instead of being treated as one word.
  nameInput.value = nameInput.value.split(' ').map(sanitizeNamePart).join(' ');
  nameInput.setSelectionRange(Math.max(0, pos - (before - nameInput.value.length)), Math.max(0, pos - (before - nameInput.value.length)));
});

document.getElementById('save-btn').addEventListener('click', async () => {
  const msg = document.getElementById('save-msg');
  const name = nameInput.value.trim();
  if (!name) {
    msg.textContent = 'Name cannot be empty.';
    msg.className = 'save-msg bad';
    return;
  }
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  msg.className = 'save-msg';
  try {
    const res = await fetch(API + '/api/account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (res.status === 401) { window.location.href = '/login'; return; }
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    originalName = name;
    msg.textContent = 'Saved.';
    msg.className = 'save-msg good';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'save-msg bad';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!confirm('Delete your account and all your survey/group data? This cannot be undone.')) return;
  const btn = document.getElementById('delete-btn');
  btn.disabled = true;
  btn.textContent = 'Deleting…';
  try {
    const res = await fetch(API + '/api/account', { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    window.location.href = '/login';
  } catch (err) {
    alert('Something went wrong: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Delete my account';
  }
});

// ── Sidebar ──
function setChatNav(groupId, groupName){
  const link = document.getElementById('nav-chat');
  const empty = document.getElementById('nav-chat-empty');
  if (!groupId) { empty.textContent = 'None yet'; return; }
  link.href = '/chat?group=' + encodeURIComponent(groupId);
  link.title = groupName;
  document.getElementById('nav-chat-name').textContent = groupName;
  link.hidden = false;
  empty.hidden = true;
}
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
});
</script>
</body>
</html>
