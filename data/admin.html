<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMatch Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F0; --surface:#FFFFFF; --surface-2:#EAEDE7; --border:#DBDFD6;
    --text:#1B211D; --text-dim:#5C665E; --text-faint:#8B948B;
    --accent:#2F6F5E; --accent-soft:#DEEBE6; --accent-ink:#0E362B;
    --amber:#B97418; --amber-soft:#F3E3CB;
    --good:#357A54; --good-soft:#E1EFE5;
    --warn:#A5701E; --warn-soft:#F2E5CE;
    --bad:#A83C3C; --bad-soft:#F3E0DD;
    --shadow: 0 1px 2px rgba(20,24,20,.06), 0 6px 20px -12px rgba(20,24,20,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181A; --surface:#1B2123; --surface-2:#20272A; --border:#2B3234;
      --text:#E8EBE6; --text-dim:#A2ABA1; --text-faint:#707A72;
      --accent:#61C0A4; --accent-soft:#1E3833; --accent-ink:#CFF3E5;
      --amber:#EFB559; --amber-soft:#3A2E1A;
      --good:#5AB37E; --good-soft:#1D3527;
      --warn:#E0A247; --warn-soft:#3A2F17;
      --bad:#E27B7B; --bad-soft:#3A2222;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  header{border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;}
  header .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
  header h1{margin:0;font-size:16px;}
  main{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat .n{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar input, .toolbar select{
    padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;
  }
  .toolbar input{flex:1;min-width:180px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--text-dim);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;
    border-bottom:1px solid var(--border);position:sticky;top:0;
  }
  td{padding:9px 12px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface-2);}

  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge.synthetic{background:var(--surface-2);color:var(--text-dim);}
  .badge.real{background:var(--accent-soft);color:var(--accent-ink);}
  .muted{color:var(--text-faint);}

  .btn-del{
    background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:6px;
    padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .btn-del:hover{filter:brightness(1.1);}
  .btn-del:disabled{opacity:.5;cursor:not-allowed;}

  .empty{padding:40px;text-align:center;color:var(--text-faint);}
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:12px 16px;font-size:13px;box-shadow:var(--shadow);display:none;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">StudyMatch</div>
    <h1>Admin — People</h1>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search name or student_id…">
    <select id="filter-source">
      <option value="">All sources</option>
      <option value="real">Real only</option>
      <option value="synthetic">Synthetic only</option>
    </select>
    <select id="filter-course">
      <option value="">All courses</option>
    </select>
  </div>

  <div class="panel">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Source</th><th>Course</th>
            <th>Archetype</th><th>Group</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none;">No matching people.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = '';
let ALL = [];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function renderStats(rows){
  const real = rows.filter(r => r.source === 'real').length;
  const unassigned = rows.filter(r => !r.group_id).length;
  const el = document.getElementById('stats');
  el.innerHTML = [
    ['Total', rows.length], ['Synthetic', rows.length - real],
    ['Real', real], ['Unassigned', unassigned],
  ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const src = document.getElementById('filter-source').value;
  const course = document.getElementById('filter-course').value;

  const rows = ALL.filter(r =>
    (!q || r.name.toLowerCase().includes(q) || r.student_id.toLowerCase().includes(q)) &&
    (!src || r.source === src) &&
    (!course || r.course_code === course)
  );

  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('tbody').innerHTML = rows.map(r => `
    <tr data-id="${r.student_id}">
      <td class="mono muted">${r.student_id}</td>
      <td>${r.name}</td>
      <td><span class="badge ${r.source}">${r.source}</span></td>
      <td>${r.course_code}</td>
      <td>${r.archetype_name || '<span class="muted">—</span>'}</td>
      <td>${r.group_name || '<span class="muted">unassigned</span>'}</td>
      <td><button class="btn-del" onclick="del('${r.student_id}', '${r.name.replace(/'/g, "\\'")}')">Delete</button></td>
    </tr>
  `).join('');
}

async function del(id, name){
  if (!confirm(`Delete ${name} (${id})? This removes them everywhere — personality data, group membership, chat, feedback. Cannot be undone.`)) return;
  const btn = document.querySelector(`tr[data-id="${id}"] .btn-del`);
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(`${API}/api/admin/students/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    ALL = ALL.filter(r => r.student_id !== id);
    renderStats(ALL);
    render();
    toast(`Deleted ${name}.`);
  } catch (err) {
    toast('Delete failed: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

async function load(){
  ALL = await fetch(API + '/api/admin/students').then(r => r.json());
  const courses = [...new Set(ALL.map(r => r.course_code))].sort();
  document.getElementById('filter-course').innerHTML =
    '<option value="">All courses</option>' + courses.map(c => `<option>${c}</option>`).join('');
  renderStats(ALL);
  render();
}
['search', 'filter-source', 'filter-course'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));
load();
</script>
</body>
</html>
